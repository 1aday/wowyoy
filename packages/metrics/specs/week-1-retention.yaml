id: week-1-retention
name: Week 1 retention
aliases:
  - W1 retention
  - First-week retention
  - Week one retention
family: engagement
kind: rate
polarity: up-is-good

definition:
  one_line: The share of new people who are active again in their second week, between 7 and 14 days after their first event, by the week they arrived.
  formula: People with any event from 7 to 14 days after their first event (days 7–13, hours 168 to 336) ÷ people whose first event fell in the cohort week

events:
  - name: "*"
    description: Any event a person sends. A person's first ever event places them in a cohort; any later event counts as a return.
    also_called: [All events, Any event, Active event]
    properties:
      - name: $os
        description: The operating system, for splitting by platform.
      - name: utm_source
        description: The campaign source a person arrived from, for splitting by acquisition channel.

numerator:
  label: New people active again 7 to 14 days later
  aggregate: returning_users
  event: "*"

queries:
  hogql: |-
    -- Week 1 retention for the 26 most recent mature cohorts (ISO weeks, Monday start, UTC, the latest starting three weeks before this one): of the people whose first event fell in the cohort week, the share with any event 7 to 14 days after it. Younger cohorts are left out until their window has closed.
    SELECT
      toString(cohort) AS week,
      sum(retained) AS numerator,
      count() AS denominator,
      sum(retained) / count() AS value
    FROM (
      SELECT
        f.person_id AS person,
        toMonday(f.first_at) AS cohort,
        max(if(e.ts >= f.first_at + toIntervalDay(7) AND e.ts < f.first_at + toIntervalDay(14), 1, 0)) AS retained
      FROM (
        SELECT person_id, min(timestamp) AS first_at
        FROM events
        WHERE timestamp < toMonday(now())
        GROUP BY person_id
      ) AS f
      INNER JOIN (
        SELECT person_id, timestamp AS ts
        FROM events
        WHERE timestamp >= toMonday(now()) - toIntervalWeek(28)
          AND timestamp < toMonday(now())
      ) AS e ON e.person_id = f.person_id
      WHERE f.first_at >= toMonday(now()) - toIntervalWeek(28)
        AND f.first_at < toMonday(now()) - toIntervalWeek(2)
      GROUP BY person, cohort
    )
    GROUP BY cohort
    ORDER BY cohort
  postgres: |-
    -- Week 1 retention for the 26 most recent mature cohorts (ISO weeks, Monday start, UTC, the latest starting three weeks before this one): of the people whose first event fell in the cohort week, the share with any event 7 to 14 days after it. Younger cohorts are left out until their window has closed.
    WITH firsts AS (
      SELECT user_id, min(occurred_at) AS first_at
      FROM events
      WHERE user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT user_id, first_at, date_trunc('week', first_at)::date AS week
      FROM firsts
      WHERE first_at >= date_trunc('week', now()) - interval '28 weeks'
        AND first_at < date_trunc('week', now()) - interval '2 weeks'
    ),
    retained AS (
      SELECT DISTINCT c.user_id
      FROM cohort AS c
      JOIN events AS e
        ON e.user_id = c.user_id
       AND e.occurred_at >= c.first_at + interval '7 days'
       AND e.occurred_at < c.first_at + interval '14 days'
    )
    SELECT
      c.week,
      count(r.user_id) AS numerator,
      count(*) AS denominator,
      count(r.user_id)::numeric / count(*) AS value
    FROM cohort AS c
    LEFT JOIN retained AS r ON r.user_id = c.user_id
    GROUP BY c.week
    ORDER BY c.week;
  bigquery: |-
    -- Week 1 retention for the 26 most recent mature cohorts (ISO weeks, Monday start, UTC, the latest starting three weeks before this one): of the people whose first event fell in the cohort week, the share with any event 7 to 14 days after it. Younger cohorts are left out until their window has closed.
    WITH firsts AS (
      SELECT user_id, MIN(occurred_at) AS first_at
      FROM events
      WHERE user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT user_id, first_at, DATE_TRUNC(DATE(first_at), ISOWEEK) AS week
      FROM firsts
      WHERE first_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 28 WEEK))
        AND first_at < TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 2 WEEK))
    ),
    retained AS (
      SELECT DISTINCT c.user_id
      FROM cohort AS c
      JOIN events AS e
        ON e.user_id = c.user_id
       AND e.occurred_at >= TIMESTAMP_ADD(c.first_at, INTERVAL 7 DAY)
       AND e.occurred_at < TIMESTAMP_ADD(c.first_at, INTERVAL 14 DAY)
    )
    SELECT
      c.week,
      COUNT(r.user_id) AS numerator,
      COUNT(*) AS denominator,
      SAFE_DIVIDE(COUNT(r.user_id), COUNT(*)) AS value
    FROM cohort AS c
    LEFT JOIN retained AS r ON r.user_id = c.user_id
    GROUP BY c.week
    ORDER BY c.week;
  snowflake: |-
    -- Week 1 retention for the 26 most recent mature cohorts (ISO weeks, Monday start, UTC, the latest starting three weeks before this one): of the people whose first event fell in the cohort week, the share with any event 7 to 14 days after it. Younger cohorts are left out until their window has closed. Assumes WEEK_START = 1 (Monday).
    WITH firsts AS (
      SELECT user_id, MIN(occurred_at) AS first_at
      FROM events
      WHERE user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT user_id, first_at, DATE_TRUNC('week', first_at)::date AS week
      FROM firsts
      WHERE first_at >= DATEADD(week, -28, DATE_TRUNC('week', CURRENT_DATE()))
        AND first_at < DATEADD(week, -2, DATE_TRUNC('week', CURRENT_DATE()))
    ),
    retained AS (
      SELECT DISTINCT c.user_id
      FROM cohort AS c
      JOIN events AS e
        ON e.user_id = c.user_id
       AND e.occurred_at >= DATEADD(day, 7, c.first_at)
       AND e.occurred_at < DATEADD(day, 14, c.first_at)
    )
    SELECT
      c.week,
      COUNT(r.user_id) AS numerator,
      COUNT(*) AS denominator,
      COUNT(r.user_id) / NULLIF(COUNT(*), 0) AS value
    FROM cohort AS c
    LEFT JOIN retained AS r ON r.user_id = c.user_id
    GROUP BY c.week
    ORDER BY c.week;

noise:
  type: process
  min_denominator: 100
  volume_unit: new people in the cohort
  typical: 0.3

example:
  business: app
  level: 0.31
  volume: 8500
  trend: 0.03

drivers:
  - id: identity
    label: Identity and tracking
    dropped:
      check: Did returning people start appearing as new, for example after an SDK, login or identity change?
      yes: New people jump and their retention falls from the same date, with no change in sign-ups.
    spiked:
      check: Did a tracking change stop counting one-time visitors as new people?
      yes: Cohorts shrink from one date, mostly people with a single event, and retention rises with no product change.
  - id: calendar
    label: Calendar
    feed: holidays
    dropped:
      check: Did the cohort's second week fall over a holiday?
      yes: Cohorts whose days 7 to 14 overlap a holiday retain less, and the next cohort recovers.
    spiked:
      check: Did the cohort arrive in a high-intent season, such as the new year for a budgeting app?
      yes: The same cohorts last year retained better too.
  - id: platform
    label: Platform and releases
    breakdown: $os
    feed: app-stores
    dropped:
      check: Did a release break something new people hit in their first days, on one platform?
      yes: Retention falls for cohorts on one platform or app version only.
    spiked:
      check: Did a release fix a first-week problem on one platform?
      yes: Retention rises for cohorts on that platform from the release date.
  - id: acquisition-mix
    label: Where new people came from
    breakdown: utm_source
    dropped:
      check: Did more of the cohort come from a broad or low-intent source, such as a new paid campaign?
      yes: One source grew its share of new people and retains far below the others.
    spiked:
      check: Did a low-retention source shrink, or a high-intent one such as referrals grow?
      yes: The mix shifted toward sources that always retain better; each source's own rate is flat.
  - id: onboarding
    label: Onboarding and activation
    metric: activation-rate
    dropped:
      check: Did fewer new people reach the first key action in their first days?
      yes: Activation for the same cohorts falls, starting with a release or an onboarding test.
    spiked:
      check: Did an onboarding change get more people to the key action?
      yes: Activation rose for the same cohorts and retention rose with it.
  - id: reminders
    label: First-week reminders
    dropped:
      check: Did the emails or pushes that bring new people back in their second week stop or get throttled?
      yes: Returns from reminder opens in days 7 to 14 fall while other returns hold.
    spiked:
      check: Did a new reminder for the second week go live?
      yes: Returns from reminder opens rise; check week 4 retention to see whether they stay.

diagnose_order: [identity, calendar, platform, acquisition-mix, onboarding, reminders]

related: [week-4-retention, activation-rate, onboarding-completion-rate, signups, resurrected-users]

prose:
  why_it_matters: >-
    Week 1 retention is the first honest read of whether new people found what they came for, and
    it caps every later week: people who don't come back in their second week rarely come back at
    all. Because it is read per arrival cohort, it shows an onboarding or acquisition change within
    three weeks. A drop from 31% to 27% on 8,500 new people a week is 340 people a week who would
    otherwise have stayed.
  pitfalls:
    - Calendar-week retention, active in the week after the arrival week, gives a Sunday arrival a one-day gap and a Monday arrival seven. This spec measures from each person's own first event.
    - Cohorts younger than three weeks haven't had their full window yet, and including them shows a false drop. Only mature cohorts are reported.
    - Counting every first event as a new person includes bots and returning people whose old id wasn't recognised. Fix identity before reading retention.
    - A low-intent campaign lowers the cohort's retention with no change in the product. Split by source before blaming onboarding.

reviewed_by: null
reviewed_at: null
version: 1

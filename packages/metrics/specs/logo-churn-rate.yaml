id: logo-churn-rate
name: Logo churn rate
aliases:
  - Customer churn rate
  - Churn rate
  - Logo churn
  - Account churn rate
  - Subscriber churn rate
family: subscription
kind: rate
polarity: down-is-good

definition:
  one_line: The share of customers paying at the start of the week who were no longer paying at its end.
  formula: Customers paying at Monday 00:00 UTC with no paying subscription at Sunday 23:59 ÷ customers paying at Monday 00:00

events:
  - name: subscription_updated
    description: Any change to a subscription's plan, quantity, discount or status, with its new monthly amount.
    also_called: [customer.subscription.updated, Subscription Updated, subscription_changed]
    properties:
      - name: subscription_id
        description: The billing system's subscription id.
      - name: mrr
        description: The subscription's monthly amount after the change; zero on a free plan.
      - name: status
        description: active, trialing, past_due or canceled.

numerator:
  label: Customers who stopped paying
  aggregate: unique_users
  event: subscription_updated
  where:
    - property: status
      op: eq
      value: canceled

queries:
  hogql: |-
    -- Logo churn rate for each of the last 26 complete weeks (Monday 00:00 UTC), oldest first: customers paying at the start of the week with no paying subscription at its end ÷ customers paying at the start. A customer is the person on the subscription; paying means active or past_due with MRR above zero, at each subscription's latest subscription_updated.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(c.churned, 0) AS numerator,
      coalesce(c.paying, 0) AS denominator,
      if(denominator = 0, NULL, numerator / denominator) AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(1, 27))) AS week
    ) AS w
    LEFT JOIN (
      SELECT week, countIf(paying_end = 0) AS churned, count() AS paying
      FROM (
        SELECT week, account, maxIf(paying, weeks_back = 1) AS paying_start, maxIf(paying, weeks_back = 0) AS paying_end
        FROM (
          SELECT
            week,
            weeks_back,
            tupleElement(latest, 1) AS account,
            if(tupleElement(latest, 3) IN ('active', 'past_due') AND tupleElement(latest, 2) > 0, 1, 0) AS paying
          FROM (
            SELECT s.week AS week, s.weeks_back AS weeks_back, u.subscription_id AS subscription_id, argMax(tuple(u.person, u.mrr, u.status), u.ts) AS latest
            FROM (
              SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(1, 27))) AS week, arrayJoin([0, 1]) AS weeks_back
            ) AS s
            CROSS JOIN (
              SELECT
                toString(properties.subscription_id) AS subscription_id,
                person_id AS person,
                toTimeZone(timestamp, 'UTC') AS ts,
                toFloat(properties.mrr) AS mrr,
                toString(properties.status) AS status
              FROM events
              WHERE event = 'subscription_updated'
                AND properties.subscription_id IS NOT NULL
                AND person_id IS NOT NULL
                AND toMonday(toTimeZone(timestamp, 'UTC')) < toMonday(toTimeZone(now(), 'UTC'))
            ) AS u
            WHERE toMonday(u.ts) <= s.week - toIntervalWeek(s.weeks_back)
            GROUP BY week, weeks_back, subscription_id
          )
        )
        GROUP BY week, account
      )
      WHERE paying_start = 1
      GROUP BY week
    ) AS c ON c.week = w.week
    ORDER BY week
  postgres: |-
    -- Logo churn rate for each of the last 26 complete weeks (Monday 00:00 UTC), oldest first: customers paying at the start of the week with no paying subscription at its end ÷ customers paying at the start. A customer is the user_id on the subscription; paying means active or past_due with MRR above zero, at each subscription's latest subscription_updated.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '1 week',
        interval '1 week'
      ) AS g(week)
    ),
    snaps AS (
      SELECT w.week, b.weeks_back, w.week + 7 * (1 - b.weeks_back) AS cutoff
      FROM weeks AS w
      CROSS JOIN (VALUES (0), (1)) AS b(weeks_back)
    ),
    updates AS (
      SELECT
        properties->>'subscription_id' AS subscription_id,
        user_id AS customer,
        occurred_at AT TIME ZONE 'UTC' AS ts,
        CASE WHEN properties->>'mrr' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'mrr')::numeric END AS mrr,
        properties->>'status' AS status
      FROM events
      WHERE event_name = 'subscription_updated'
        AND properties->>'subscription_id' IS NOT NULL
        AND user_id IS NOT NULL
        AND occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
    ),
    latest AS (
      SELECT DISTINCT ON (s.week, s.weeks_back, u.subscription_id) s.week, s.weeks_back, u.customer, u.mrr, u.status
      FROM snaps AS s
      JOIN updates AS u ON u.ts < s.cutoff
      ORDER BY s.week, s.weeks_back, u.subscription_id, u.ts DESC
    ),
    paying AS (
      SELECT DISTINCT week, weeks_back, customer
      FROM latest
      WHERE status IN ('active', 'past_due') AND mrr > 0
    ),
    weekly AS (
      SELECT st.week, count(*) FILTER (WHERE en.customer IS NULL) AS churned, count(*) AS paying
      FROM paying AS st
      LEFT JOIN paying AS en ON en.week = st.week AND en.weeks_back = 0 AND en.customer = st.customer
      WHERE st.weeks_back = 1
      GROUP BY st.week
    )
    SELECT
      w.week,
      coalesce(c.churned, 0) AS numerator,
      coalesce(c.paying, 0) AS denominator,
      c.churned::numeric / nullif(c.paying, 0) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS c ON c.week = w.week
    ORDER BY w.week;
  bigquery: |-
    -- Logo churn rate for each of the last 26 complete weeks (Monday 00:00 UTC), oldest first: customers paying at the start of the week with no paying subscription at its end ÷ customers paying at the start. A customer is the user_id on the subscription; paying means active or past_due with MRR above zero, at each subscription's latest subscription_updated.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    snaps AS (
      SELECT w.week, weeks_back, TIMESTAMP(DATE_ADD(w.week, INTERVAL (1 - weeks_back) WEEK)) AS cutoff
      FROM weeks AS w
      CROSS JOIN UNNEST([0, 1]) AS weeks_back
    ),
    updates AS (
      SELECT
        JSON_VALUE(properties, '$.subscription_id') AS subscription_id,
        user_id AS customer,
        occurred_at,
        SAFE_CAST(JSON_VALUE(properties, '$.mrr') AS FLOAT64) AS mrr,
        JSON_VALUE(properties, '$.status') AS status
      FROM events
      WHERE event_name = 'subscription_updated'
        AND JSON_VALUE(properties, '$.subscription_id') IS NOT NULL
        AND user_id IS NOT NULL
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
    ),
    latest AS (
      SELECT s.week, s.weeks_back, u.customer, u.mrr, u.status
      FROM snaps AS s
      CROSS JOIN updates AS u
      WHERE u.occurred_at < s.cutoff
      QUALIFY ROW_NUMBER() OVER (PARTITION BY s.week, s.weeks_back, u.subscription_id ORDER BY u.occurred_at DESC) = 1
    ),
    paying AS (
      SELECT DISTINCT week, weeks_back, customer
      FROM latest
      WHERE status IN ('active', 'past_due') AND mrr > 0
    ),
    weekly AS (
      SELECT st.week, COUNTIF(en.customer IS NULL) AS churned, COUNT(*) AS paying
      FROM paying AS st
      LEFT JOIN paying AS en ON en.week = st.week AND en.weeks_back = 0 AND en.customer = st.customer
      WHERE st.weeks_back = 1
      GROUP BY st.week
    )
    SELECT
      w.week,
      COALESCE(c.churned, 0) AS numerator,
      COALESCE(c.paying, 0) AS denominator,
      SAFE_DIVIDE(c.churned, c.paying) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS c ON c.week = w.week
    ORDER BY w.week;
  snowflake: |-
    -- Logo churn rate for each of the last 26 complete weeks (Monday 00:00 UTC), oldest first: customers paying at the start of the week with no paying subscription at its end ÷ customers paying at the start. A customer is the user_id on the subscription; paying means active or past_due with MRR above zero, at each subscription's latest subscription_updated.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -1 * ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    snaps AS (
      SELECT w.week, b.weeks_back, DATEADD(week, 1 - b.weeks_back, w.week) AS cutoff
      FROM weeks AS w
      CROSS JOIN (VALUES (0), (1)) AS b (weeks_back)
    ),
    updates AS (
      SELECT
        properties:"subscription_id"::string AS subscription_id,
        user_id AS customer,
        occurred_at,
        TRY_TO_DOUBLE(properties:"mrr"::string) AS mrr,
        properties:"status"::string AS status
      FROM events
      WHERE event_name = 'subscription_updated'
        AND properties:"subscription_id"::string IS NOT NULL
        AND user_id IS NOT NULL
        AND occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
    ),
    latest AS (
      SELECT s.week, s.weeks_back, u.customer, u.mrr, u.status
      FROM snaps AS s
      JOIN updates AS u ON u.occurred_at < s.cutoff
      QUALIFY ROW_NUMBER() OVER (PARTITION BY s.week, s.weeks_back, u.subscription_id ORDER BY u.occurred_at DESC) = 1
    ),
    paying AS (
      SELECT DISTINCT week, weeks_back, customer
      FROM latest
      WHERE status IN ('active', 'past_due') AND mrr > 0
    ),
    weekly AS (
      SELECT st.week, COUNT_IF(en.customer IS NULL) AS churned, COUNT(*) AS paying
      FROM paying AS st
      LEFT JOIN paying AS en ON en.week = st.week AND en.weeks_back = 0 AND en.customer = st.customer
      WHERE st.weeks_back = 1
      GROUP BY st.week
    )
    SELECT
      w.week,
      COALESCE(c.churned, 0) AS numerator,
      COALESCE(c.paying, 0) AS denominator,
      c.churned::float / NULLIF(c.paying, 0) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS c ON c.week = w.week
    ORDER BY w.week;

noise:
  type: binomial
  min_denominator: 300
  volume_unit: paying customers at week start
  typical: 0.0056
  reference_volumes: [500, 2000, 8000, 30000]

example:
  business: saas
  level: 0.0056
  volume: 1900
  trend: 0

drivers:
  - id: billing-sync
    label: Billing sync
    dropped:
      check: Did cancellations or status changes stop reaching the event log?
      yes: The billing system shows more ended subscriptions this week than the snapshot does.
    spiked:
      check: Did a sync or migration mark live customers as canceled, or cancel old unpaid subscriptions in bulk?
      yes: Customers leave the paying count on one day with no cancellation in the billing system, or the ones that left had been past due for weeks.
  - id: involuntary
    label: Failed payments
    feed: stripe
    dropped:
      check: Did dunning, retries or a card updater recover customers who would have lapsed?
      yes: Fewer customers end in past_due and then canceled, while voluntary cancellations hold.
    spiked:
      check: Did more customers lapse for failed payments, from expiring cards, a dunning change or a processor incident?
      yes: The extra churn is customers who went past_due first; Stripe shows an incident or more declines.
  - id: renewal-cohort
    label: Renewals due
    dropped:
      check: Did few annual or quarterly renewals fall due this week?
      yes: Renewals due were unusually few; expect the rate to return to normal when they are.
    spiked:
      check: Did a large group of annual plans reach their renewal date?
      yes: The customers who left cluster on start dates one year ago.
  - id: plan-split
    label: Plan
    breakdown: plan
    dropped:
      check: Is the fall concentrated in one plan?
      yes: One plan's churn falls after a change there, such as new onboarding or a price cut.
    spiked:
      check: Is one plan losing far more customers than the rest?
      yes: One plan's churn jumps, often the cheapest, after a price or packaging change.
  - id: new-customers
    label: New customers leaving early
    metric: activation-rate
    dropped:
      check: Did cohorts that went through a better onboarding reach their first renewals?
      yes: Customers who signed up after an onboarding change churn less in their first months than earlier cohorts.
    spiked:
      check: Is the churn concentrated in customers in their first 90 days?
      yes: Young customers are most of the churn, which points at onboarding, activation or a mis-sold segment.
  - id: usage-decline
    label: Usage before leaving
    metric: wau
    dropped:
      check: Did usage at accounts that looked at risk recover?
      yes: Weekly active users at low-usage accounts rose in the weeks before they would have renewed.
    spiked:
      check: Did the customers who left stop using the product weeks before they canceled?
      yes: Active users at those accounts fell for a month or more first, so the cause is upstream, in usage.

diagnose_order: [billing-sync, involuntary, renewal-cohort, plan-split, new-customers, usage-decline]

related: [churned-mrr, gross-revenue-retention, net-revenue-retention, arpa, customer-lifetime-value]

prose:
  why_it_matters: >-
    Logo churn counts customers, not dollars, so it shows people leaving even when a few large
    accounts keep revenue churn low. A weekly rate of 0.56% sounds small and is about 2.4% a
    month, and loses about a quarter of the customer base in a year. At 1,900 customers, chance
    alone moves one week's rate by nearly as much as the rate itself, so read it over four weeks
    or more.
  pitfalls:
    - Divide by customers paying at the start of the period. Using the end, or an average, lets this week's sign-ups dilute the rate.
    - Customers who start and leave inside the same week are not in the starting count, so they are not in the numerator either. Count them on their own if they are common.
    - A weekly rate is not a monthly rate divided by four. Convert with 1 − (1 − weekly)^4.35, which turns 0.56% a week into about 2.4% a month.
    - Moving to a free plan is churn here, because the customer stopped paying. Report it apart from cancellations if free plans are common.
    - Counting subscriptions instead of customers inflates churn every time someone changes plan by canceling one subscription and starting another.

reviewed_by: wowyoy
reviewed_at: "2026-10-21"

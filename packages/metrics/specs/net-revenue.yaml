id: net-revenue
name: Net revenue
aliases:
  - Weekly revenue
  - Net sales
family: revenue
catalog_id: revenue
kind: currency
polarity: up-is-good

definition:
  one_line: Order revenue after discounts from orders paid this week, minus refunds issued this week, before tax and shipping.
  formula: Sum of order totals after discounts − refunds issued in the week, both excluding tax and shipping

events:
  - name: order_completed
    description: A paid order confirmed by the server, not the thank-you page view.
    also_called: [purchase, Order Completed, checkout_completed]
    properties:
      - name: total
        description: Order value after discounts, before tax and shipping.
      - name: order_id
        description: Unique per order; deduplicates retries and reloads.
  - name: order_refunded
    description: A refund issued against an earlier order, full or partial.
    also_called: [refund, Order Refunded, charge.refunded]
    properties:
      - name: order_id
        description: The order refunded.
      - name: amount
        description: The refunded amount, excluding tax and shipping.

numerator:
  label: Net revenue
  aggregate: sum
  event: order_completed
  property: total
subtract:
  label: Refunds issued
  aggregate: sum
  event: order_refunded
  property: amount

noise:
  type: compound
  cv: 0.9
  min_denominator: 50
  volume_unit: orders a week
  typical: 260000

example:
  business: store
  level: 1290000
  volume: 13300
  trend: 0.2
  season: 1

drivers:
  - id: tracking
    label: Tracking change
    dropped:
      check: Did order events stop arriving from one checkout, app or country, or did total change meaning?
      yes: The store's own sales report holds while recorded revenue falls from one day.
    spiked:
      check: Are orders recorded twice, test orders included, or totals arriving in another currency or with tax added?
      yes: Recorded revenue exceeds the store's sales report, or the same order_id appears more than once.
  - id: orders
    label: Orders
    metric: orders
    dropped:
      check: Did the number of orders fall, or only what each order is worth?
      yes: Orders fall by about as much as revenue while order value holds.
    spiked:
      check: Is the rise in the number of orders rather than their size?
      yes: Orders rise by about as much as revenue while order value holds.
  - id: order-value
    label: Order value
    metric: aov
    dropped:
      check: Did the average order shrink, from a discount, a mix shift or fewer items per order?
      yes: Order value falls while the number of orders holds.
    spiked:
      check: Did a few large orders or a price rise lift the average?
      yes: Order value jumps, often driven by a handful of orders far above the usual size.
  - id: traffic
    label: Traffic
    metric: sessions
    feed: google-search
    dropped:
      check: Did fewer people arrive, and from which channel?
      yes: Sessions fall in one channel by about as much as orders do.
    spiked:
      check: Did a campaign, press mention or ranking change bring more visitors?
      yes: Sessions rise in one channel, and conversion holds.
  - id: conversion
    label: Store conversion
    metric: conversion-rate
    dropped:
      check: Did the share of visits that buy fall, and at which step?
      yes: Conversion falls while traffic holds; one funnel step explains most of it.
    spiked:
      check: Did more visits buy, and at which step?
      yes: Conversion rises while traffic holds; one funnel step explains most of it.
  - id: refunds
    label: Refunds
    metric: refund-rate
    dropped:
      check: Did refunds spike, from a bad batch, a delivery failure or a chargeback wave?
      yes: Gross sales hold while refunds rise.
    spiked:
      check: Did refunds fall back after an unusual week?
      yes: Refunds return to their usual share and net revenue recovers.
  - id: calendar
    label: Calendar
    feed: shopping
    dropped:
      check: Is last week's comparison a sale, holiday or payday week?
      yes: The same week last year shows the same dip once aligned on the event.
    spiked:
      check: Is this week a sale, holiday or payday week?
      yes: The same week last year shows the same jump once aligned on the event.

diagnose_order: [tracking, calendar, orders, order-value, refunds, traffic, conversion]

related: [orders, aov, conversion-rate, gross-sales, refund-rate]

prose:
  why_it_matters: >-
    Revenue is the number everyone reads first, which is why it is the worst number to act on
    alone. It is orders times order value, and orders are traffic times conversion; a move in
    revenue is only useful once you know which of those moved. Most weeks, nothing did, and the
    honest answer is that the change is the ordinary wobble of thousands of orders of different sizes.
  pitfalls:
    - Refunds are subtracted in the week they are issued, not the week of the order they belong to, as in Shopify's net sales. A big sale week's returns land in the weeks after it.
    - Including tax and shipping makes revenue move with tax rules and carrier prices you don't control.
    - A few very large orders can move a small store's week by 10% or more. Check the order count before the total.
    - Revenue in several currencies needs a constant exchange rate across the weeks being compared, or currency moves look like sales.

reviewed_by: null
reviewed_at: null
version: 1

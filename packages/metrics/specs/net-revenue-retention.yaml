id: net-revenue-retention
name: Net revenue retention
aliases:
  - NRR
  - NDR
  - Net dollar retention
  - Net revenue retention rate
  - Net retention
family: subscription
kind: rate
polarity: up-is-good

definition:
  one_line: The MRR today from customers who were paying 12 months ago, as a share of what they paid then, after expansion, contraction and churn.
  formula: MRR at this week's end from customers paying 52 weeks earlier ÷ their MRR then; customers who started since are left out

events:
  - name: subscription_updated
    description: Any change to a subscription's plan, quantity, discount or status, with its new monthly amount.
    also_called: [customer.subscription.updated, Subscription Updated, subscription_changed]
    properties:
      - name: subscription_id
        description: The billing system's subscription id.
      - name: mrr
        description: The subscription's monthly amount after the change, after discounts, before tax.
      - name: status
        description: active, trialing, past_due or canceled.

numerator:
  label: MRR now from customers paying a year ago
  aggregate: sum
  event: subscription_updated
  property: mrr

queries:
  hogql: |-
    -- Net revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier ÷ their MRR then. A customer is the person on the subscription; customers who started since are left out, and those who left count as zero.
    SELECT
      toString(monday) AS week,
      sum(end_mrr) AS numerator,
      sum(start_mrr) AS denominator,
      sum(end_mrr) / sum(start_mrr) AS value
    FROM (
      SELECT
        monday,
        account,
        sumIf(sub_mrr, weeks_back = 52) AS start_mrr,
        sumIf(sub_mrr, weeks_back = 0) AS end_mrr
      FROM (
        SELECT
          s.monday AS monday,
          s.weeks_back AS weeks_back,
          e.sub_id AS sub_id,
          argMax(e.person, e.ts) AS account,
          if(argMax(e.state, e.ts) IN ('active', 'past_due'), argMax(e.amount, e.ts), 0) AS sub_mrr
        FROM (
          SELECT
            toMonday(now()) - toIntervalWeek(arrayJoin(range(1, 27))) AS monday,
            arrayJoin([0, 52]) AS weeks_back
        ) AS s
        CROSS JOIN (
          SELECT
            toString(properties.subscription_id) AS sub_id,
            person_id AS person,
            toFloat(properties.mrr) AS amount,
            toString(properties.status) AS state,
            timestamp AS ts
          FROM events
          WHERE event = 'subscription_updated'
        ) AS e
        WHERE e.ts < s.monday + toIntervalWeek(1) - toIntervalWeek(s.weeks_back)
        GROUP BY monday, weeks_back, sub_id
      )
      GROUP BY monday, account
    )
    WHERE start_mrr > 0
    GROUP BY monday
    ORDER BY monday
  postgres: |-
    -- Net revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero.
    WITH snaps AS (
      SELECT w.week, b.weeks_back, w.week + (1 - b.weeks_back) * interval '1 week' AS cutoff
      FROM generate_series(
        date_trunc('week', now()) - interval '26 weeks',
        date_trunc('week', now()) - interval '1 week',
        interval '1 week'
      ) AS w(week)
      CROSS JOIN (VALUES (0), (52)) AS b(weeks_back)
    ),
    latest AS (
      SELECT DISTINCT ON (s.week, s.weeks_back, e.properties->>'subscription_id')
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        CASE WHEN e.properties->>'mrr' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (e.properties->>'mrr')::numeric END AS mrr,
        e.properties->>'status' AS status
      FROM snaps AS s
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < s.cutoff
      ORDER BY s.week, s.weeks_back, e.properties->>'subscription_id', e.occurred_at DESC
    ),
    customers AS (
      SELECT
        week,
        customer,
        coalesce(sum(mrr) FILTER (WHERE weeks_back = 52), 0) AS start_mrr,
        coalesce(sum(mrr) FILTER (WHERE weeks_back = 0), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week::date AS week,
      sum(end_mrr) AS numerator,
      sum(start_mrr) AS denominator,
      sum(end_mrr) / nullif(sum(start_mrr), 0) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;
  bigquery: |-
    -- Net revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero.
    WITH snaps AS (
      SELECT week, weeks_back, DATE_ADD(week, INTERVAL (1 - weeks_back) WEEK) AS cutoff
      FROM UNNEST(GENERATE_DATE_ARRAY(
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK),
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK),
        INTERVAL 1 WEEK
      )) AS week
      CROSS JOIN UNNEST([0, 52]) AS weeks_back
    ),
    latest AS (
      SELECT
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        SAFE_CAST(JSON_VALUE(e.properties, '$.mrr') AS FLOAT64) AS mrr,
        JSON_VALUE(e.properties, '$.status') AS status
      FROM snaps AS s
      JOIN events AS e
        ON DATE(e.occurred_at) < s.cutoff
      WHERE e.event_name = 'subscription_updated'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY s.week, s.weeks_back, JSON_VALUE(e.properties, '$.subscription_id')
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    customers AS (
      SELECT
        week,
        customer,
        COALESCE(SUM(IF(weeks_back = 52, mrr, NULL)), 0) AS start_mrr,
        COALESCE(SUM(IF(weeks_back = 0, mrr, NULL)), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(end_mrr) AS numerator,
      SUM(start_mrr) AS denominator,
      SAFE_DIVIDE(SUM(end_mrr), SUM(start_mrr)) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;
  snowflake: |-
    -- Net revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero. Assumes WEEK_START = 1 (Monday).
    WITH weeks AS (
      SELECT DATEADD(week, -ROW_NUMBER() OVER (ORDER BY SEQ4()), DATE_TRUNC('week', CURRENT_DATE())) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    snaps AS (
      SELECT w.week, b.weeks_back, DATEADD(week, 1 - b.weeks_back, w.week) AS cutoff
      FROM weeks AS w
      CROSS JOIN (VALUES (0), (52)) AS b (weeks_back)
    ),
    latest AS (
      SELECT
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        e.properties:mrr::float AS mrr,
        e.properties:status::string AS status
      FROM snaps AS s
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < s.cutoff
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY s.week, s.weeks_back, e.properties:subscription_id::string
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    customers AS (
      SELECT
        week,
        customer,
        COALESCE(SUM(IFF(weeks_back = 52, mrr, NULL)), 0) AS start_mrr,
        COALESCE(SUM(IFF(weeks_back = 0, mrr, NULL)), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(end_mrr) AS numerator,
      SUM(start_mrr) AS denominator,
      SUM(end_mrr) / NULLIF(SUM(start_mrr), 0) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;

noise:
  type: process
  min_denominator: 50
  volume_unit: customers in the starting cohort
  typical: 1.01

example:
  business: saas
  level: 1.01
  volume: 1570
  trend: 0

drivers:
  - id: customer-ids
    label: Customer ids
    dropped:
      check: Did a customer-id migration or a billing change split existing customers, so their MRR now looks new?
      yes: Customers in the starting cohort show zero MRR while new customers with the same names or domains appear.
    spiked:
      check: Did accounts merge, attaching new subscriptions to customers from a year ago?
      yes: Cohort customers gain MRR from subscriptions that started this year with no upgrade event.
  - id: cohort-window
    label: Which customers are in the window
    dropped:
      check: Did a strong cohort leave the starting window, or a weak one enter it?
      yes: The move starts the week a big signup month from 12 months ago crosses the window edge, with no change in this week's behaviour.
    spiked:
      check: Did a weak cohort leave the starting window, or a strong one enter it?
      yes: The move starts the week a cohort with unusual churn crosses the window edge, with no change in this week's behaviour.
  - id: large-accounts
    label: Large accounts
    dropped:
      check: Did one large customer churn or downgrade?
      yes: Leaving out the ten largest customers, NRR is flat; one of them explains the move.
    spiked:
      check: Did one large customer expand?
      yes: Leaving out the ten largest customers, NRR is flat; one big upgrade explains the move.
  - id: churn
    label: Churned MRR
    metric: churned-mrr
    feed: stripe
    dropped:
      check: Did more of last year's customers cancel or lapse for failed payments?
      yes: Churned MRR from customers older than 12 months rises over the trailing quarter.
    spiked:
      check: Did cancellations among long-standing customers slow?
      yes: Churned MRR from customers older than 12 months falls over the trailing quarter.
  - id: contraction
    label: Downgrades
    breakdown: plan
    dropped:
      check: Are customers keeping the product but paying less, with fewer seats, cheaper plans or smaller commitments?
      yes: Contraction among cohort customers rises while cancellations hold, often after their own budget cuts.
    spiked:
      check: Did downgrades slow, or was a downgrade path removed?
      yes: Contraction among cohort customers falls; if a cheaper plan was removed, watch churn.
  - id: expansion
    label: Expansion
    metric: expansion-mrr
    dropped:
      check: Are last year's customers adding fewer seats, upgrades and add-ons?
      yes: Expansion MRR from customers older than 12 months falls over the trailing quarter.
    spiked:
      check: Did upgrades, seat growth or a price increase lift what last year's customers pay?
      yes: Expansion from cohort customers rises; a price increase shows as many accounts rising by the same percentage.

diagnose_order: [customer-ids, cohort-window, large-accounts, churn, contraction, expansion]

related: [gross-revenue-retention, expansion-mrr, churned-mrr, logo-churn-rate, mrr]

prose:
  why_it_matters: >-
    Net revenue retention asks whether last year's customers pay more or less today, with no help
    from new sales. Above 100% the existing base grows on its own; at 101% NRR and 88% gross
    retention, churn and downgrades take 12% a year and expansion from the customers who stay
    wins back 13%. It is a trailing-year figure that moves slowly by design, so a one-point move
    is worth explaining.
  pitfalls:
    - A monthly NRR and a trailing 12-month NRR on a fixed cohort are different numbers, and compounding the monthly one doesn't give the annual. This spec uses the 12-month fixed cohort that public SaaS companies report.
    - New customers stay out of both sides until they are a year old. Including them turns NRR into MRR growth.
    - Measuring per subscription instead of per customer counts a plan change done as cancel and resubscribe as churn, and the new subscription never enters the cohort.
    - At a few thousand customers, one large account can move NRR by several points. Report it with and without the largest customers.
    - A price increase lifts NRR once, for a year. Note the week it reaches renewals, or it reads as a lasting improvement in expansion.


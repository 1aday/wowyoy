id: gross-revenue-retention
name: Gross revenue retention
aliases:
  - GRR
  - Gross dollar retention
  - GDR
  - Gross retention
  - Gross revenue retention rate
family: subscription
kind: rate
polarity: up-is-good

definition:
  one_line: The share of what customers paid 12 months ago that they still pay today, counting churn and downgrades but no expansion.
  formula: Sum over customers paying 52 weeks earlier of the lesser of their MRR now and their MRR then ÷ their MRR then

events:
  - name: subscription_updated
    description: Any change to a subscription's plan, quantity, discount or status, with its new monthly amount.
    also_called: [customer.subscription.updated, Subscription Updated, subscription_changed]
    properties:
      - name: subscription_id
        description: The billing system's subscription id.
      - name: mrr
        description: The subscription's monthly amount after the change, after discounts, before tax.
      - name: status
        description: active, trialing, past_due or canceled.

numerator:
  label: MRR kept from customers paying a year ago, capped at what each paid then
  aggregate: sum
  event: subscription_updated
  property: mrr

queries:
  hogql: |-
    -- Gross revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier, each capped at what it paid then, ÷ their MRR then. A customer is the person on the subscription; customers who started since are left out, and those who left count as zero.
    SELECT
      toString(monday) AS week,
      sum(least(end_mrr, start_mrr)) AS numerator,
      sum(start_mrr) AS denominator,
      sum(least(end_mrr, start_mrr)) / sum(start_mrr) AS value
    FROM (
      SELECT
        monday,
        account,
        sumIf(sub_mrr, weeks_back = 52) AS start_mrr,
        sumIf(sub_mrr, weeks_back = 0) AS end_mrr
      FROM (
        SELECT
          s.monday AS monday,
          s.weeks_back AS weeks_back,
          e.sub_id AS sub_id,
          argMax(e.person, e.ts) AS account,
          if(argMax(e.state, e.ts) IN ('active', 'past_due'), argMax(e.amount, e.ts), 0) AS sub_mrr
        FROM (
          SELECT
            toMonday(now()) - toIntervalWeek(arrayJoin(range(1, 27))) AS monday,
            arrayJoin([0, 52]) AS weeks_back
        ) AS s
        CROSS JOIN (
          SELECT
            toString(properties.subscription_id) AS sub_id,
            person_id AS person,
            toFloat(properties.mrr) AS amount,
            toString(properties.status) AS state,
            timestamp AS ts
          FROM events
          WHERE event = 'subscription_updated'
        ) AS e
        WHERE e.ts < s.monday + toIntervalWeek(1) - toIntervalWeek(s.weeks_back)
        GROUP BY monday, weeks_back, sub_id
      )
      GROUP BY monday, account
    )
    WHERE start_mrr > 0
    GROUP BY monday
    ORDER BY monday
  postgres: |-
    -- Gross revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier, each capped at what it paid then, ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero.
    WITH snaps AS (
      SELECT w.week, b.weeks_back, w.week + (1 - b.weeks_back) * interval '1 week' AS cutoff
      FROM generate_series(
        date_trunc('week', now()) - interval '26 weeks',
        date_trunc('week', now()) - interval '1 week',
        interval '1 week'
      ) AS w(week)
      CROSS JOIN (VALUES (0), (52)) AS b(weeks_back)
    ),
    latest AS (
      SELECT DISTINCT ON (s.week, s.weeks_back, e.properties->>'subscription_id')
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        CASE WHEN e.properties->>'mrr' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (e.properties->>'mrr')::numeric END AS mrr,
        e.properties->>'status' AS status
      FROM snaps AS s
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < s.cutoff
      ORDER BY s.week, s.weeks_back, e.properties->>'subscription_id', e.occurred_at DESC
    ),
    customers AS (
      SELECT
        week,
        customer,
        coalesce(sum(mrr) FILTER (WHERE weeks_back = 52), 0) AS start_mrr,
        coalesce(sum(mrr) FILTER (WHERE weeks_back = 0), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week::date AS week,
      sum(least(end_mrr, start_mrr)) AS numerator,
      sum(start_mrr) AS denominator,
      sum(least(end_mrr, start_mrr)) / nullif(sum(start_mrr), 0) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;
  bigquery: |-
    -- Gross revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier, each capped at what it paid then, ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero.
    WITH snaps AS (
      SELECT week, weeks_back, DATE_ADD(week, INTERVAL (1 - weeks_back) WEEK) AS cutoff
      FROM UNNEST(GENERATE_DATE_ARRAY(
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK),
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK),
        INTERVAL 1 WEEK
      )) AS week
      CROSS JOIN UNNEST([0, 52]) AS weeks_back
    ),
    latest AS (
      SELECT
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        SAFE_CAST(JSON_VALUE(e.properties, '$.mrr') AS FLOAT64) AS mrr,
        JSON_VALUE(e.properties, '$.status') AS status
      FROM snaps AS s
      JOIN events AS e
        ON DATE(e.occurred_at) < s.cutoff
      WHERE e.event_name = 'subscription_updated'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY s.week, s.weeks_back, JSON_VALUE(e.properties, '$.subscription_id')
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    customers AS (
      SELECT
        week,
        customer,
        COALESCE(SUM(IF(weeks_back = 52, mrr, NULL)), 0) AS start_mrr,
        COALESCE(SUM(IF(weeks_back = 0, mrr, NULL)), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(LEAST(end_mrr, start_mrr)) AS numerator,
      SUM(start_mrr) AS denominator,
      SAFE_DIVIDE(SUM(LEAST(end_mrr, start_mrr)), SUM(start_mrr)) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;
  snowflake: |-
    -- Gross revenue retention, trailing 12 months, for each of the last 26 complete ISO weeks (Monday start, UTC): MRR at the week's end from customers who were paying at the end of the same week 52 weeks earlier, each capped at what it paid then, ÷ their MRR then. A customer is the event's user_id; customers who started since are left out, and those who left count as zero. Assumes WEEK_START = 1 (Monday).
    WITH weeks AS (
      SELECT DATEADD(week, -ROW_NUMBER() OVER (ORDER BY SEQ4()), DATE_TRUNC('week', CURRENT_DATE())) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    snaps AS (
      SELECT w.week, b.weeks_back, DATEADD(week, 1 - b.weeks_back, w.week) AS cutoff
      FROM weeks AS w
      CROSS JOIN (VALUES (0), (52)) AS b (weeks_back)
    ),
    latest AS (
      SELECT
        s.week,
        s.weeks_back,
        e.user_id AS customer,
        e.properties:mrr::float AS mrr,
        e.properties:status::string AS status
      FROM snaps AS s
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < s.cutoff
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY s.week, s.weeks_back, e.properties:subscription_id::string
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    customers AS (
      SELECT
        week,
        customer,
        COALESCE(SUM(IFF(weeks_back = 52, mrr, NULL)), 0) AS start_mrr,
        COALESCE(SUM(IFF(weeks_back = 0, mrr, NULL)), 0) AS end_mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(LEAST(end_mrr, start_mrr)) AS numerator,
      SUM(start_mrr) AS denominator,
      SUM(LEAST(end_mrr, start_mrr)) / NULLIF(SUM(start_mrr), 0) AS value
    FROM customers
    WHERE start_mrr > 0
    GROUP BY week
    ORDER BY week;

noise:
  type: process
  min_denominator: 50
  volume_unit: customers in the starting cohort
  typical: 0.88

example:
  business: saas
  level: 0.88
  volume: 1570
  trend: 0

drivers:
  - id: customer-ids
    label: Customer ids
    dropped:
      check: Did a customer-id migration or a billing change split existing customers, so their MRR now looks new?
      yes: Customers in the starting cohort show zero MRR while new customers with the same names or domains appear.
    spiked:
      check: Did accounts merge, so customers who left now look retained?
      yes: Cohort customers who canceled show MRR again from subscriptions that belong to someone else.
  - id: cohort-window
    label: Which customers are in the window
    dropped:
      check: Did a cohort with unusually high churn enter the starting window?
      yes: The move starts the week a large or poorly fitted signup month from 12 months ago crosses the window edge.
    spiked:
      check: Did a cohort with unusually high churn leave the starting window?
      yes: The move starts the week that cohort crosses the window edge, with no change in this week's behaviour.
  - id: involuntary
    label: Failed payments
    feed: stripe
    dropped:
      check: Did more of last year's customers lapse for failed payments?
      yes: A rising share of the cohort's lost MRR ended in past_due; Stripe shows declines or an incident.
    spiked:
      check: Did dunning or a card updater recover customers who used to lapse?
      yes: Fewer cohort customers end in past_due and then canceled.
  - id: logo-split
    label: Many small losses or a few large ones
    metric: logo-churn-rate
    dropped:
      check: Is the loss many small customers or a few large ones?
      yes: Rising logo churn means many small losses; flat logo churn with falling GRR means a few large accounts left or shrank.
    spiked:
      check: Is the improvement broad, or one large account that stayed?
      yes: Logo churn falls too when it is broad; otherwise one renewal explains it.
  - id: churn
    label: Churned MRR
    metric: churned-mrr
    dropped:
      check: Did more of last year's customers cancel?
      yes: Churned MRR from customers older than 12 months rises over the trailing quarter.
    spiked:
      check: Did cancellations among long-standing customers slow?
      yes: Churned MRR from customers older than 12 months falls over the trailing quarter.
  - id: contraction
    label: Downgrades
    breakdown: plan
    dropped:
      check: Are customers keeping the product but paying less, with fewer seats, cheaper plans or smaller commitments?
      yes: Contraction among cohort customers rises while cancellations hold, often after their own budget cuts.
    spiked:
      check: Did downgrades slow, or was a downgrade path removed?
      yes: Contraction among cohort customers falls; if a cheaper plan was removed, watch churn.

diagnose_order: [customer-ids, cohort-window, involuntary, logo-split, churn, contraction]

related: [net-revenue-retention, churned-mrr, logo-churn-rate, mrr, customer-lifetime-value]

prose:
  why_it_matters: >-
    Gross revenue retention is the floor under net retention: what last year's customers still
    pay if no one expands. It cannot pass 100%, which makes it the cleanest read of churn and
    downgrades, and the number investors use to judge product fit. A SaaS at 88% has to replace
    12% of last year's revenue before any growth counts.
  pitfalls:
    - Cap each customer at its starting MRR before summing. Letting one customer's expansion offset another's downgrade is NRR, not GRR.
    - Measure per customer, not per subscription, or a plan change done as cancel and resubscribe counts as churn.
    - A monthly GRR and a 12-month fixed-cohort GRR are different numbers. 99% a month compounds to 89% a year only if churn is the same at every customer age, which it rarely is.
    - A customer who leaves and returns within the year counts at what it pays now, capped. Don't count its return as new business in this cohort.
    - Failed-payment lapses pull GRR down as much as cancellations. Split them, because the fix is in billing, not the product.


id: onboarding-completion-rate
name: Onboarding completion rate
aliases:
  - Onboarding completion
  - Onboarding rate
  - Setup completion rate
family: activation
kind: rate
polarity: up-is-good

definition:
  one_line: The share of people who signed up in a week who finished onboarding within 7 days of signing up.
  formula: Signups who completed onboarding within 7 days ÷ signups, by signup week

events:
  - name: signed_up
    description: An account created, sent by the server when the account exists, not when the form is submitted.
    also_called: [sign_up, Signed Up, user_signed_up, account_created]
    properties:
      - name: method
        description: How the account was created, such as email, google, sso or invite.
  - name: onboarding_completed
    description: The last required onboarding step finished, not skipped.
    also_called: [Onboarding Completed, tutorial_complete, setup_completed]
    properties: []

numerator:
  label: Signups who completed onboarding within 7 days
  aggregate: unique_users
  event: onboarding_completed
denominator:
  label: People who signed up
  aggregate: unique_users
  event: signed_up

queries:
  hogql: |-
    -- Onboarding completion rate: of people whose first signup fell in each week, the share who completed onboarding within 7 days of signing up. Signup weeks 27 to 2 weeks before this one (Monday 00:00 UTC), oldest first; last week's signups are left out until their 7 days close.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(c.converted_people, 0) AS numerator,
      coalesce(c.people, 0) AS denominator,
      if(denominator = 0, NULL, numerator / denominator) AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(2, 28))) AS week
    ) AS w
    LEFT JOIN (
      SELECT week, countIf(converted) AS converted_people, count() AS people
      FROM (
        SELECT
          toMonday(s.start_at) AS week,
          s.person_id AS person_id,
          countIf(x.ts >= s.start_at AND x.ts < s.start_at + toIntervalDay(7)) > 0 AS converted
        FROM (
          SELECT person_id, min(toTimeZone(timestamp, 'UTC')) AS start_at
          FROM events
          WHERE event = 'signed_up'
            AND person_id IS NOT NULL
          GROUP BY person_id
        ) AS s
        LEFT JOIN (
          SELECT person_id, toTimeZone(timestamp, 'UTC') AS ts
          FROM events
          WHERE event = 'onboarding_completed'
            AND timestamp >= now() - toIntervalWeek(29)
        ) AS x ON x.person_id = s.person_id
        WHERE toMonday(s.start_at) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(27) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(2)
        GROUP BY week, person_id
      )
      GROUP BY week
    ) AS c ON c.week = w.week
    ORDER BY week
  postgres: |-
    -- Onboarding completion rate: of people whose first signup fell in each week, the share who completed onboarding within 7 days of signing up. Signup weeks 27 to 2 weeks before this one (Monday 00:00 UTC), oldest first; last week's signups are left out until their 7 days close.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '27 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '2 weeks',
        interval '1 week'
      ) AS g(week)
    ),
    starts AS (
      SELECT user_id, min(occurred_at AT TIME ZONE 'UTC') AS start_at
      FROM events
      WHERE event_name = 'signed_up'
        AND user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT
        date_trunc('week', s.start_at)::date AS week,
        s.user_id,
        count(x.occurred_at) > 0 AS converted
      FROM starts AS s
      LEFT JOIN events AS x
        ON x.user_id = s.user_id
       AND x.event_name = 'onboarding_completed'
       AND x.occurred_at AT TIME ZONE 'UTC' >= s.start_at
       AND x.occurred_at AT TIME ZONE 'UTC' < s.start_at + interval '7 days'
      WHERE s.start_at >= date_trunc('week', now() AT TIME ZONE 'UTC') - interval '27 weeks'
        AND s.start_at < date_trunc('week', now() AT TIME ZONE 'UTC') - interval '1 week'
      GROUP BY 1, 2
    )
    SELECT
      w.week,
      count(c.user_id) FILTER (WHERE c.converted) AS numerator,
      count(c.user_id) AS denominator,
      (count(c.user_id) FILTER (WHERE c.converted))::numeric / nullif(count(c.user_id), 0) AS value
    FROM weeks AS w
    LEFT JOIN cohort AS c ON c.week = w.week
    GROUP BY w.week
    ORDER BY w.week;
  bigquery: |-
    -- Onboarding completion rate: of people whose first signup fell in each week, the share who completed onboarding within 7 days of signing up. Signup weeks 27 to 2 weeks before this one (Monday 00:00 UTC), oldest first; last week's signups are left out until their 7 days close.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 27 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 2 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    starts AS (
      SELECT user_id, MIN(occurred_at) AS start_at
      FROM events
      WHERE event_name = 'signed_up'
        AND user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT
        DATE_TRUNC(DATE(s.start_at), ISOWEEK) AS week,
        s.user_id,
        COUNT(x.occurred_at) > 0 AS converted
      FROM starts AS s
      LEFT JOIN events AS x
        ON x.user_id = s.user_id
       AND x.event_name = 'onboarding_completed'
       AND x.occurred_at >= s.start_at
       AND x.occurred_at < TIMESTAMP_ADD(s.start_at, INTERVAL 7 DAY)
      WHERE s.start_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 27 WEEK))
        AND s.start_at < TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK))
      GROUP BY week, s.user_id
    )
    SELECT
      w.week,
      COUNTIF(c.converted) AS numerator,
      COUNT(c.user_id) AS denominator,
      SAFE_DIVIDE(COUNTIF(c.converted), COUNT(c.user_id)) AS value
    FROM weeks AS w
    LEFT JOIN cohort AS c ON c.week = w.week
    GROUP BY w.week
    ORDER BY w.week;
  snowflake: |-
    -- Onboarding completion rate: of people whose first signup fell in each week, the share who completed onboarding within 7 days of signing up. Signup weeks 27 to 2 weeks before this one (Monday 00:00 UTC), oldest first; last week's signups are left out until their 7 days close.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -1 - ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    starts AS (
      SELECT user_id, MIN(occurred_at) AS start_at
      FROM events
      WHERE event_name = 'signed_up'
        AND user_id IS NOT NULL
      GROUP BY user_id
    ),
    cohort AS (
      SELECT
        DATEADD(day, 1 - DAYOFWEEKISO(s.start_at), s.start_at::date) AS week,
        s.user_id,
        COUNT(x.occurred_at) > 0 AS converted
      FROM starts AS s
      LEFT JOIN events AS x
        ON x.user_id = s.user_id
       AND x.event_name = 'onboarding_completed'
       AND x.occurred_at >= s.start_at
       AND x.occurred_at < DATEADD(day, 7, s.start_at)
      WHERE s.start_at >= DATEADD(week, -27, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND s.start_at < DATEADD(week, -1, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
      GROUP BY 1, 2
    )
    SELECT
      w.week,
      COUNT_IF(c.converted) AS numerator,
      COUNT(c.user_id) AS denominator,
      COUNT_IF(c.converted)::float / NULLIF(COUNT(c.user_id), 0) AS value
    FROM weeks AS w
    LEFT JOIN cohort AS c ON c.week = w.week
    GROUP BY w.week
    ORDER BY w.week;

noise:
  type: binomial
  min_denominator: 100
  volume_unit: signups in the cohort
  typical: 0.61

example:
  business: saas
  level: 0.61
  volume: 2200
  trend: 0.04

drivers:
  - id: tracking
    label: Onboarding event
    dropped:
      check: Did the completion event move, get renamed, or stop firing on one platform?
      yes: Completion falls overnight on one platform or app version while people still reach the screens after onboarding.
    spiked:
      check: Does the event now fire when people skip, or at an earlier step?
      yes: Completion jumps overnight while activation for the same cohorts doesn't move.
  - id: errors
    label: Errors and outages
    metric: error-rate
    feed: cloudflare
    dropped:
      check: Did an error, an outage or a slow third-party step block people mid-onboarding?
      yes: Errors on one onboarding step rose on the days the cohort was signing up.
    spiked:
      check: Did a fix to a failing step ship?
      yes: The step that failed before now completes, and completion recovers from the release date.
  - id: flow-change
    label: Onboarding flow
    breakdown: $device_type
    dropped:
      check: Was a step added, or did the flow break on one device or browser?
      yes: Drop-off concentrates on one step or one device from the day of a release.
    spiked:
      check: Was a step removed, made optional or pre-filled?
      yes: Completion rises from the release date on every device; check that activation rose too.
  - id: signup-quality
    label: Who signed up
    metric: signups
    breakdown: utm_source
    dropped:
      check: Did the cohort include a wave of low-intent or bot signups?
      yes: Signups from one source rose that week and almost none of them finished onboarding.
    spiked:
      check: Did a low-intent source stop, leaving a smaller, more committed cohort?
      yes: Signups from one source fell that week while completion elsewhere held.
  - id: method
    label: Signup method
    breakdown: method
    dropped:
      check: Did more people sign up by a method that sends them through a longer flow, such as email instead of single sign-on?
      yes: The mix shifted toward the slower method while completion within each method held.
    spiked:
      check: Did more people arrive by invite or single sign-on, which skip steps?
      yes: The mix shifted toward invited or SSO signups while completion within each method held.

diagnose_order: [tracking, errors, flow-change, signup-quality, method]

related: [activation-rate, time-to-value, signups, invite-rate, error-rate]

prose:
  why_it_matters: >-
    Onboarding is the one part of activation a product team fully controls: every step is a screen
    someone designed, and every step loses people. Measured on the same cohorts and window as
    activation rate, the gap between the two says whether onboarding teaches the product or only gets
    people through a form. At Copperline about 61% finish onboarding while 34% activate.
  pitfalls:
    - Adding or removing a step changes what complete means. Note the release date and compare only cohorts on the same flow.
    - High completion with flat activation means onboarding is easy but not useful; skippable checklists often look like this.
    - People who press skip must not fire onboarding_completed, or the rate measures patience, not setup.
    - Only cohorts whose 7 days have closed are reported, so the latest point is the signups of two weeks ago.

reviewed_by: null
reviewed_at: null
version: 1

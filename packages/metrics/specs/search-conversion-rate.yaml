id: search-conversion-rate
name: Search conversion rate
aliases:
  - Site search conversion rate
  - Search to purchase rate
  - Search conversion
family: conversion
kind: rate
polarity: up-is-good

definition:
  one_line: The share of sessions that used site search and then placed a paid order in the same session.
  formula: Sessions that searched, then ordered ÷ sessions that searched

events:
  - name: product_searched
    description: A search submitted in the store's search box, or its results page shown, once per search.
    also_called: [search, view_search_results, Products Searched, search_submitted]
    properties:
      - name: query
        description: What the shopper typed, as submitted.
      - name: results_count
        description: How many products the search returned; 0 is a dead end.
  - name: order_completed
    description: A paid order confirmed by the server, carrying the browser's session id.
    also_called: [purchase, Order Completed, checkout_completed]
    properties:
      - name: order_id
        description: Unique per order; deduplicates retries and reloads.

numerator:
  label: Sessions that searched, then ordered
  aggregate: unique_sessions
  event: order_completed
denominator:
  label: Sessions that searched
  aggregate: unique_sessions
  event: product_searched

queries:
  hogql: |-
    -- Search conversion rate per week: sessions that searched, then placed an order ÷ sessions that searched. Each session counts in the week of its first search. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(s.converted, 0) AS numerator,
      coalesce(s.sessions, 0) AS denominator,
      if(coalesce(s.sessions, 0) = 0, NULL, s.converted / s.sessions) AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(1, 27))) AS week
    ) AS w
    LEFT JOIN (
      SELECT
        toMonday(toTimeZone(x.searched_at, 'UTC')) AS week,
        countIf(x.order_count > 0 AND x.ordered_at >= x.searched_at) AS converted,
        count() AS sessions
      FROM (
        SELECT
          $session_id AS session_id,
          minIf(timestamp, event = 'product_searched') AS searched_at,
          maxIf(timestamp, event = 'order_completed') AS ordered_at,
          countIf(event = 'order_completed') AS order_count
        FROM events
        WHERE event IN ('product_searched', 'order_completed')
          AND $session_id != ''
          AND timestamp >= now() - toIntervalWeek(27)
          AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(26) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
        GROUP BY session_id
        HAVING countIf(event = 'product_searched') > 0
      ) AS x
      GROUP BY week
    ) AS s ON s.week = w.week
    ORDER BY week
  postgres: |-
    -- Search conversion rate per week: sessions that searched, then placed an order ÷ sessions that searched. Each session counts in the week of its first search. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '1 week',
        interval '1 week'
      ) AS g(week)
    ),
    searches AS (
      SELECT
        session_id,
        min(occurred_at) FILTER (WHERE event_name = 'product_searched') AS searched_at,
        max(occurred_at) FILTER (WHERE event_name = 'order_completed') AS ordered_at
      FROM events
      WHERE event_name IN ('product_searched', 'order_completed')
        AND session_id <> ''
        AND occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks') AT TIME ZONE 'UTC'
        AND occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
      GROUP BY session_id
    ),
    weekly AS (
      SELECT
        date_trunc('week', searched_at AT TIME ZONE 'UTC')::date AS week,
        count(*) FILTER (WHERE ordered_at >= searched_at) AS converted,
        count(*) AS sessions
      FROM searches
      WHERE searched_at IS NOT NULL
      GROUP BY 1
    )
    SELECT
      w.week,
      coalesce(s.converted, 0) AS numerator,
      coalesce(s.sessions, 0) AS denominator,
      s.converted::numeric / nullif(s.sessions, 0) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS s ON s.week = w.week
    ORDER BY w.week;
  bigquery: |-
    -- Search conversion rate per week: sessions that searched, then placed an order ÷ sessions that searched. Each session counts in the week of its first search. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    searches AS (
      SELECT
        session_id,
        MIN(IF(event_name = 'product_searched', occurred_at, NULL)) AS searched_at,
        MAX(IF(event_name = 'order_completed', occurred_at, NULL)) AS ordered_at
      FROM events
      WHERE event_name IN ('product_searched', 'order_completed')
        AND session_id <> ''
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
      GROUP BY session_id
    ),
    weekly AS (
      SELECT
        DATE_TRUNC(DATE(searched_at), ISOWEEK) AS week,
        COUNTIF(ordered_at >= searched_at) AS converted,
        COUNT(*) AS sessions
      FROM searches
      WHERE searched_at IS NOT NULL
      GROUP BY week
    )
    SELECT
      w.week,
      COALESCE(s.converted, 0) AS numerator,
      COALESCE(s.sessions, 0) AS denominator,
      SAFE_DIVIDE(s.converted, s.sessions) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS s ON s.week = w.week
    ORDER BY w.week;
  snowflake: |-
    -- Search conversion rate per week: sessions that searched, then placed an order ÷ sessions that searched. Each session counts in the week of its first search. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -1 * ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    searches AS (
      SELECT
        session_id,
        MIN(IFF(event_name = 'product_searched', occurred_at, NULL)) AS searched_at,
        MAX(IFF(event_name = 'order_completed', occurred_at, NULL)) AS ordered_at
      FROM events
      WHERE event_name IN ('product_searched', 'order_completed')
        AND session_id <> ''
        AND occurred_at >= DATEADD(week, -26, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
      GROUP BY session_id
    ),
    weekly AS (
      SELECT
        DATEADD(day, 1 - DAYOFWEEKISO(searched_at), searched_at::date) AS week,
        COUNT_IF(ordered_at >= searched_at) AS converted,
        COUNT(*) AS sessions
      FROM searches
      WHERE searched_at IS NOT NULL
      GROUP BY 1
    )
    SELECT
      w.week,
      COALESCE(s.converted, 0) AS numerator,
      COALESCE(s.sessions, 0) AS denominator,
      s.converted::float / NULLIF(s.sessions, 0) AS value
    FROM weeks AS w
    LEFT JOIN weekly AS s ON s.week = w.week
    ORDER BY w.week;

noise:
  type: binomial
  min_denominator: 500
  volume_unit: sessions with a search a week
  typical: 0.05
  reference_volumes: [500, 2000, 10000, 50000]

example:
  business: store
  level: 0.052
  volume: 66000
  trend: 0.03

drivers:
  - id: tracking
    label: Tracking change
    dropped:
      check: Did a search app or theme change start firing product_searched on autocomplete keystrokes?
      yes: Sessions with a search jump on the release day, many with a one- or two-letter query and nothing after it.
    spiked:
      check: Did product_searched stop firing on some pages or devices, leaving only the most determined searchers?
      yes: Sessions with a search fall on one device or template while search orders hold.
  - id: store-wide
    label: The whole store
    metric: conversion-rate
    dropped:
      check: Did conversion fall for everyone, not only for searchers?
      yes: Search conversion and store conversion fall together, so the cause is checkout, price or the calendar, not search.
    spiked:
      check: Did conversion rise for everyone, from a sale or a fix elsewhere?
      yes: Search conversion and store conversion rise together, so search itself didn't change.
  - id: zero-results
    label: Searches with no results
    dropped:
      check: Did more searches return nothing, from a catalogue change, lost synonyms or a trending term you don't stock?
      yes: The share of searches with results_count of 0 rises, concentrated in a few queries.
    spiked:
      check: Did a synonym, spelling or catalogue fix cut dead-end searches?
      yes: Zero-result searches fall from the day of the fix, on the queries it covered.
  - id: stock
    label: Stock of searched products
    dropped:
      check: Are the products people search for most out of stock or missing common sizes?
      yes: Top queries still return results, but their first results are sold out.
    spiked:
      check: Did a much-searched product come back in stock or launch?
      yes: Orders after searching for that product's name jump from the restock or launch day.
  - id: relevance
    label: Ranking and relevance
    dropped:
      check: Did a search app update, re-index or merchandising rule push irrelevant or sold-out products to the top?
      yes: Clicks on the first results fall for the top queries from the day of the change.
    spiked:
      check: Did a relevance change or test ship, and is it on for everyone?
      yes: The rise starts on the release day across devices and queries.
  - id: who-searches
    label: Who searches
    breakdown: $device_type
    dropped:
      check: Did the search box become more prominent, so more casual browsers search?
      yes: Sessions with a search grow faster than orders after searching; search-driven orders still rise.
    spiked:
      check: Did the search box move or shrink, leaving fewer but more committed searchers?
      yes: Sessions with a search fall while orders after searching hold.

diagnose_order: [tracking, store-wide, zero-results, stock, relevance, who-searches]

related: [conversion-rate, product-view-rate, add-to-cart-rate, revenue-per-session]

prose:
  why_it_matters: >-
    Shoppers who search say what they want in their own words, and they usually convert well
    above the store average; at Northwind, 5.2% against 2.1%. A fall here is usually something
    the team controls, such as a search app update, lost synonyms or empty results for the
    words people actually type.
  pitfalls:
    - Searchers are more committed than average, so a high search conversion doesn't prove search works. Compare search conversion with itself over time, not with the store rate.
    - Predictive search that fires the event on each keystroke counts sessions that never submitted a search. Fire product_searched on submit or on the results view.
    - This spec credits search only when the order follows in the same session. A shopper who searches today and buys tomorrow counts as a search that didn't convert.
    - Zero-result searches are the fastest thing to check. A catalogue, synonym or search app change shows up there on the day it ships, often before orders tell you.

reviewed_by: null
reviewed_at: null
version: 1

id: pages-per-session
name: Pages per session
aliases:
  - Pages per visit
  - Pageviews per session
  - Views per session
  - Page depth
family: traffic
kind: ratio
polarity: up-is-good

definition:
  one_line: The average number of pages viewed in one visit, across all visits in the week.
  formula: Page views ÷ sessions with a page view

events:
  - name: $pageview
    description: One page load or client-side route change, captured in the browser.
    also_called: [page_view, Page Viewed, page]
    properties:
      - name: $session_id
        description: Set by the analytics SDK; ties the page view to a visit.
      - name: $pathname
        description: The page's path, for finding where visits end.
      - name: $device_type
        description: Mobile, Desktop or Tablet.

numerator:
  label: Page views
  aggregate: count
  event: $pageview
denominator:
  label: Sessions
  aggregate: unique_sessions
  event: $pageview

noise:
  type: mean
  cv: 1.3
  min_denominator: 200
  volume_unit: sessions a week
  typical: 3.4
  reference_volumes: [1000, 5000, 25000, 100000]

example:
  business: store
  level: 3.6
  volume: 600000
  trend: 0

drivers:
  - id: tracking
    label: Tracking change
    breakdown: $browser
    dropped:
      check: Did a release stop client-side route changes from sending a page view?
      yes: Page views fall on the release day while sessions, product views and orders hold.
    spiked:
      check: Is a page view firing twice, from two tags or a router that reports every route change twice?
      yes: Pages per session rise by about one (a second tag on page load) or nearly double (every route change sent twice) overnight while orders don't move.
  - id: bounce
    label: One-page visits
    metric: bounce-rate
    dropped:
      check: Did more visits leave after the first page?
      yes: Bounce rate rises by enough to explain the fall; visits that stay browse as deeply as before.
    spiked:
      check: Did fewer visits bounce, or did a bot that viewed one page stop?
      yes: Bounce rate falls and the visits that remain look like last week's.
  - id: traffic-mix
    label: Who arrived
    metric: paid-sessions
    breakdown: utm_medium
    dropped:
      check: Did a larger share of visits come from paid social, email or a viral link, which browse less?
      yes: Every channel holds its own depth but the shallow channel grew.
    spiked:
      check: Did returning visitors or search traffic, which browse more, grow as a share?
      yes: Every channel holds its own depth but the deep channel grew.
  - id: navigation
    label: Navigation, search and collections
    metric: product-view-rate
    breakdown: $pathname
    dropped:
      check: Did a menu, collection page or on-site search change make it harder to find more products?
      yes: Fewer visits move from collection or search pages to product pages after the change.
    spiked:
      check: Did a change add steps, such as pagination, a quiz or an interstitial, without adding interest?
      yes: Pages per session rise but product views and orders per session don't.
  - id: device-split
    label: Mobile vs desktop
    breakdown: $device_type
    dropped:
      check: Is the fall on one device only?
      yes: One device drops after a layout or menu change while the other holds.
    spiked:
      check: Is the rise on one device only?
      yes: One device rises after a release; confirm it isn't a page view firing twice there.

diagnose_order: [tracking, bounce, traffic-mix, navigation, device-split]

related: [bounce-rate, sessions, product-view-rate, conversion-rate, sessions-per-user]

prose:
  why_it_matters: >-
    Pages per session says how far an average visit gets into the store. It moves with intent,
    with navigation and with tracking, and only the first two are real. A store averaging 3.6
    pages gains nothing from 4.0 if the extra page is a slower checkout or a second page view
    firing; read it with product views and conversion, never alone.
  pitfalls:
    - On a single-page app, page views depend on whether every route change is tracked. A router update can change this number by a full page with no change in behaviour.
    - More pages is not always better. Pagination, quizzes and confusing menus add pages to visits that end the same way.
    - The average hides a long tail. A few bots or heavy browsers viewing hundreds of pages can lift it; check the median when it jumps.
    - Comparing with GA4 views per session needs the same unit. GA4 counts screen views from apps too and divides by all sessions, not sessions with a page view.

reviewed_by: null
reviewed_at: null
version: 1

id: roas
name: Return on ad spend
aliases:
  - Ad ROAS
  - Paid ROAS
  - Return on advertising spend
family: acquisition
kind: ratio
polarity: up-is-good

definition:
  one_line: Revenue from orders placed in visits that arrived through a paid ad, for each dollar of ad spend in the same week.
  formula: Order revenue from paid-ad sessions ÷ ad spend

events:
  - name: $pageview
    description: One page load or client-side route change; the session's first page view decides whether it came from an ad.
    also_called: [page_view, Page Viewed, page]
    properties:
      - name: utm_medium
        description: The campaign medium from the landing URL. Paid when it contains "cp", starts with "paid", or is ppc, retargeting, display or banner.
      - name: gclid
        description: Google Ads click id from auto-tagging. Also gbraid, wbraid, and msclkid for Microsoft Ads.
  - name: order_completed
    description: A paid order confirmed by the server, carrying the session id of the visit it was placed in.
    also_called: [purchase, Order Completed, checkout_completed]
    properties:
      - name: total
        description: Order value after discounts, before tax and shipping.
      - name: $session_id
        description: The visit the order was placed in, passed from the browser to the server event.
  - name: ad_spend
    description: One row per channel per day, synced from each ad platform's reporting API.
    also_called: [Ad Spend, ad_performance, campaign_daily_stats]
    properties:
      - name: spend
        description: Amount spent that day, in the store's reporting currency.

numerator:
  label: Revenue from paid-ad sessions
  aggregate: sum
  event: order_completed
  property: total
denominator:
  label: Ad spend
  aggregate: sum
  event: ad_spend
  property: spend

queries:
  hogql: |-
    -- ROAS per week: revenue from orders placed in sessions that arrived through a paid ad ÷ ad spend, both by the week they happened.
    SELECT
      a.week AS week,
      coalesce(r.revenue, 0) AS numerator,
      a.spend AS denominator,
      if(a.spend > 0, coalesce(r.revenue, 0) / a.spend, NULL) AS value
    FROM (
      SELECT toMonday(timestamp) AS week, sum(toFloat(properties.spend)) AS spend
      FROM events
      WHERE event = 'ad_spend'
        AND timestamp >= toStartOfWeek(now(), 1) - toIntervalWeek(26)
        AND timestamp < toStartOfWeek(now(), 1)
      GROUP BY week
    ) AS a
    LEFT JOIN (
      SELECT week, sum(revenue) AS revenue
      FROM (
        SELECT
          $session_id AS session_id,
          toMonday(minIf(timestamp, event = 'order_completed')) AS week,
          argMinIf(lower(coalesce(properties.utm_medium, '')), timestamp, event = '$pageview') AS medium,
          argMinIf(coalesce(properties.gclid, properties.gbraid, properties.wbraid, properties.msclkid, '') != '', timestamp, event = '$pageview') AS ad_click,
          sumIf(toFloat(properties.total), event = 'order_completed') AS revenue
        FROM events
        WHERE event IN ('$pageview', 'order_completed')
          AND $session_id IS NOT NULL
          AND timestamp >= toStartOfWeek(now(), 1) - toIntervalWeek(26)
          AND timestamp < toStartOfWeek(now(), 1)
        GROUP BY session_id
        HAVING countIf(event = 'order_completed') > 0 AND countIf(event = '$pageview') > 0
      )
      WHERE (match(medium, '^(.*cp.*|ppc|retargeting|paid.*|display|banner|interstitial|expandable)$') OR ad_click)
      GROUP BY week
    ) AS r ON r.week = a.week
    ORDER BY week
  postgres: |-
    -- ROAS per week: revenue from orders placed in sessions that arrived through a paid ad ÷ ad spend, both by the week they happened.
    WITH spend AS (
      SELECT date_trunc('week', occurred_at)::date AS week, sum(CASE WHEN properties->>'spend' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'spend')::numeric END) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= date_trunc('week', now()) - interval '26 weeks'
        AND occurred_at < date_trunc('week', now())
      GROUP BY 1
    ),
    entries AS (
      SELECT DISTINCT ON (session_id)
        session_id,
        date_trunc('week', occurred_at)::date AS week,
        lower(coalesce(properties->>'utm_medium', '')) AS medium,
        coalesce(properties->>'gclid', properties->>'gbraid', properties->>'wbraid', properties->>'msclkid', '') <> '' AS ad_click
      FROM events
      WHERE event_name = '$pageview'
        AND session_id IS NOT NULL
        AND occurred_at >= date_trunc('week', now()) - interval '26 weeks'
        AND occurred_at < date_trunc('week', now())
      ORDER BY session_id, occurred_at
    ),
    paid_revenue AS (
      SELECT date_trunc('week', o.occurred_at)::date AS week, sum(CASE WHEN o.properties->>'total' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (o.properties->>'total')::numeric END) AS revenue
      FROM events AS o
      JOIN entries AS e ON e.session_id = o.session_id
      WHERE o.event_name = 'order_completed'
        AND o.occurred_at >= date_trunc('week', now()) - interval '26 weeks'
        AND o.occurred_at < date_trunc('week', now())
        AND (e.medium ~ '^(.*cp.*|ppc|retargeting|paid.*|display|banner|interstitial|expandable)$' OR e.ad_click)
      GROUP BY 1
    )
    SELECT
      s.week,
      coalesce(p.revenue, 0) AS numerator,
      s.spend AS denominator,
      coalesce(p.revenue, 0) / nullif(s.spend, 0) AS value
    FROM spend AS s
    LEFT JOIN paid_revenue AS p ON p.week = s.week
    ORDER BY s.week;
  bigquery: |-
    -- ROAS per week: revenue from orders placed in sessions that arrived through a paid ad ÷ ad spend, both by the week they happened.
    WITH spend AS (
      SELECT DATE_TRUNC(DATE(occurred_at), ISOWEEK) AS week, sum(CAST(JSON_VALUE(properties, '$.spend') AS FLOAT64)) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
      GROUP BY 1
    ),
    entries AS (
      SELECT
        session_id,
        DATE_TRUNC(DATE(occurred_at), ISOWEEK) AS week,
        lower(coalesce(JSON_VALUE(properties, '$.utm_medium'), '')) AS medium,
        coalesce(JSON_VALUE(properties, '$.gclid'), JSON_VALUE(properties, '$.gbraid'), JSON_VALUE(properties, '$.wbraid'), JSON_VALUE(properties, '$.msclkid'), '') <> '' AS ad_click
      FROM events
      WHERE event_name = '$pageview'
        AND session_id IS NOT NULL
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
      QUALIFY ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY occurred_at) = 1
    ),
    paid_revenue AS (
      SELECT DATE_TRUNC(DATE(o.occurred_at), ISOWEEK) AS week, sum(CAST(JSON_VALUE(o.properties, '$.total') AS FLOAT64)) AS revenue
      FROM events AS o
      JOIN entries AS e ON e.session_id = o.session_id
      WHERE o.event_name = 'order_completed'
        AND o.occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK))
        AND o.occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
        AND (REGEXP_CONTAINS(e.medium, r'^(.*cp.*|ppc|retargeting|paid.*|display|banner|interstitial|expandable)$') OR e.ad_click)
      GROUP BY 1
    )
    SELECT
      s.week,
      coalesce(p.revenue, 0) AS numerator,
      s.spend AS denominator,
      SAFE_DIVIDE(COALESCE(p.revenue, 0), s.spend) AS value
    FROM spend AS s
    LEFT JOIN paid_revenue AS p ON p.week = s.week
    ORDER BY s.week;
  snowflake: |-
    -- ROAS per week: revenue from orders placed in sessions that arrived through a paid ad ÷ ad spend, both by the week they happened.
    -- Assumes WEEK_START = 1 (Monday).
    WITH spend AS (
      SELECT DATE_TRUNC('week', occurred_at)::date AS week, sum(properties:"spend"::float) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= DATEADD(week, -26, DATE_TRUNC('week', CURRENT_DATE()))
        AND occurred_at < DATE_TRUNC('week', CURRENT_DATE())
      GROUP BY 1
    ),
    entries AS (
      SELECT
        session_id,
        DATE_TRUNC('week', occurred_at)::date AS week,
        lower(coalesce(properties:"utm_medium"::string, '')) AS medium,
        coalesce(properties:"gclid"::string, properties:"gbraid"::string, properties:"wbraid"::string, properties:"msclkid"::string, '') <> '' AS ad_click
      FROM events
      WHERE event_name = '$pageview'
        AND session_id IS NOT NULL
        AND occurred_at >= DATEADD(week, -26, DATE_TRUNC('week', CURRENT_DATE()))
        AND occurred_at < DATE_TRUNC('week', CURRENT_DATE())
      QUALIFY ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY occurred_at) = 1
    ),
    paid_revenue AS (
      SELECT DATE_TRUNC('week', o.occurred_at)::date AS week, sum(o.properties:"total"::float) AS revenue
      FROM events AS o
      JOIN entries AS e ON e.session_id = o.session_id
      WHERE o.event_name = 'order_completed'
        AND o.occurred_at >= DATEADD(week, -26, DATE_TRUNC('week', CURRENT_DATE()))
        AND o.occurred_at < DATE_TRUNC('week', CURRENT_DATE())
        AND (REGEXP_LIKE(e.medium, '^(.*cp.*|ppc|retargeting|paid.*|display|banner|interstitial|expandable)$') OR e.ad_click)
      GROUP BY 1
    )
    SELECT
      s.week,
      coalesce(p.revenue, 0) AS numerator,
      s.spend AS denominator,
      DIV0NULL(COALESCE(p.revenue, 0), s.spend) AS value
    FROM spend AS s
    LEFT JOIN paid_revenue AS p ON p.week = s.week
    ORDER BY s.week;

noise:
  type: process
  min_denominator: 50
  volume_unit: orders from paid sessions a week
  typical: 2

example:
  business: store
  level: 1.7
  volume: 3800
  trend: -0.05

drivers:
  - id: attribution
    label: Tracking and attribution
    dropped:
      check: Did orders stop carrying the session id, or did a redirect strip campaign tags, so paid orders look unpaid?
      yes: Total orders hold while orders matched to paid sessions fall, from the day of a checkout or redirect change.
    spiked:
      check: Did untagged traffic start counting as paid, or are orders recorded twice?
      yes: Paid revenue rises with no rise in paid sessions, or order count exceeds the store admin's.
  - id: calendar
    label: Calendar
    feed: shopping
    dropped:
      check: Did a sale end while budgets stayed high?
      yes: The same weeks last year show the same fall in return after the event.
    spiked:
      check: Is a sale or holiday turning the same clicks into more orders?
      yes: Paid conversion jumps for the event week and the same week last year shows it too.
  - id: spend
    label: Ad spend
    metric: ad-spend
    feed: ad-platforms
    dropped:
      check: Did spend rise faster than results, from a budget increase or a new prospecting campaign?
      yes: Spend rises while paid revenue grows less; returns usually fall as budgets scale.
    spiked:
      check: Did spend fall, cutting the least efficient campaigns first?
      yes: Spend falls more than paid revenue does.
  - id: click-cost
    label: Cost per click
    metric: cpc
    dropped:
      check: Did each click get more expensive?
      yes: CPC rises by about as much as ROAS falls, while paid conversion and order value hold.
    spiked:
      check: Did clicks get cheaper?
      yes: CPC falls by about as much as ROAS rises, while paid conversion and order value hold.
  - id: paid-conversion
    label: Paid conversion rate
    metric: paid-conversion-rate
    dropped:
      check: Did fewer paid visits order, from a landing page, stock or checkout problem?
      yes: Paid conversion falls while CPC and order value hold.
    spiked:
      check: Did more paid visits order, from a better landing page or offer?
      yes: Paid conversion rises while CPC and order value hold.
  - id: order-value
    label: Order value
    metric: aov
    dropped:
      check: Did paid orders get smaller, from a discount or a cheaper hero product?
      yes: Order value from paid sessions falls while the number of paid orders holds.
    spiked:
      check: Did paid orders get bigger, from a bundle, a price rise or a few large orders?
      yes: Order value from paid sessions rises while the number of paid orders holds.

diagnose_order: [attribution, calendar, spend, click-cost, paid-conversion, order-value]

related: [mer, ad-spend, paid-conversion-rate, cpc, ncac, aov]

prose:
  why_it_matters: >-
    ROAS says whether the ads pay for themselves, and splits into three numbers that each point
    at a different team: ROAS is roughly paid conversion rate × order value ÷ cost per click. A store at
    1.7 earns $1.70 in session-attributed revenue per ad dollar; whether that is profitable
    depends on margin, so set a break-even ROAS of 1 ÷ gross margin and read against it.
  pitfalls:
    - Platform ROAS is not this number. Meta and Google count view-through and modeled conversions and each claim the same order, so the platforms' sum often runs 1.5 to 2 times what the store can match to an ad visit.
    - Session-attributed ROAS undercounts ads that work slowly. A shopper who clicks an ad, leaves, and buys from a bookmark two days later counts as direct here; read MER alongside it.
    - High ROAS can mean too little spend. Retargeting and branded search show the best returns because they reach people who would have bought anyway.
    - Orders must carry the browser's session id for this query to match them to a visit. Server-side orders without it count as unpaid.


id: net-new-mrr
name: Net new MRR
aliases:
  - Net MRR growth
  - Net MRR change
  - MRR growth
  - Net new monthly recurring revenue
family: subscription
kind: currency
polarity: up-is-good

definition:
  one_line: How much monthly recurring revenue grew or shrank this week, the sum of its four movements; it can be negative.
  formula: New MRR + expansion MRR − contraction MRR − churned MRR

events:
  - name: subscription_started
    description: A subscription's first paid period began.
    also_called: [Subscription Started, subscription_activated, invoice.paid (first)]
    properties:
      - name: mrr
        description: The new subscription's monthly amount.
  - name: subscription_expanded
    description: A paying subscription's monthly amount went up.
    also_called: [Subscription Upgraded, plan_upgraded, customer.subscription.updated]
    properties:
      - name: mrr_delta
        description: How much it rose, as a positive number.
  - name: subscription_contracted
    description: A paying subscription's monthly amount went down from a downgrade, fewer seats or less usage, without ending.
    also_called: [Subscription Downgraded, plan_downgraded]
    properties:
      - name: mrr_delta
        description: How much it fell, as a positive number.
  - name: subscription_canceled
    description: A subscription stopped being billed.
    also_called: [customer.subscription.deleted, Subscription Cancelled, subscription_ended]
    properties:
      - name: mrr
        description: The monthly amount it was paying before it ended.

numerator:
  label: New MRR, before the other three movements
  aggregate: sum
  event: subscription_started
  property: mrr

queries:
  hogql: |-
    -- Net new MRR per week: new + expansion − contraction − churned MRR, each from its event in that week. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(f.new_mrr, 0) AS new_mrr,
      coalesce(f.expansion_mrr, 0) AS expansion_mrr,
      coalesce(f.contraction_mrr, 0) AS contraction_mrr,
      coalesce(f.churned_mrr, 0) AS churned_mrr,
      new_mrr + expansion_mrr - contraction_mrr - churned_mrr AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(1, 27))) AS week
    ) AS w
    LEFT JOIN (
      SELECT
        toMonday(toTimeZone(timestamp, 'UTC')) AS week,
        sumIf(toFloat(properties.mrr), event = 'subscription_started') AS new_mrr,
        sumIf(toFloat(properties.mrr_delta), event = 'subscription_expanded') AS expansion_mrr,
        sumIf(toFloat(properties.mrr_delta), event = 'subscription_contracted') AS contraction_mrr,
        sumIf(toFloat(properties.mrr), event = 'subscription_canceled') AS churned_mrr
      FROM events
      WHERE event IN ('subscription_started', 'subscription_expanded', 'subscription_contracted', 'subscription_canceled')
        AND timestamp >= now() - toIntervalWeek(27)
        AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(26) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
      GROUP BY week
    ) AS f ON f.week = w.week
    ORDER BY week
  postgres: |-
    -- Net new MRR per week: new + expansion − contraction − churned MRR, each from its event in that week. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '1 week',
        interval '1 week'
      ) AS g(week)
    ),
    flows AS (
      SELECT
        date_trunc('week', occurred_at AT TIME ZONE 'UTC')::date AS week,
        sum(CASE WHEN properties->>'mrr' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'mrr')::numeric END) FILTER (WHERE event_name = 'subscription_started') AS new_mrr,
        sum(CASE WHEN properties->>'mrr_delta' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'mrr_delta')::numeric END) FILTER (WHERE event_name = 'subscription_expanded') AS expansion_mrr,
        sum(CASE WHEN properties->>'mrr_delta' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'mrr_delta')::numeric END) FILTER (WHERE event_name = 'subscription_contracted') AS contraction_mrr,
        sum(CASE WHEN properties->>'mrr' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'mrr')::numeric END) FILTER (WHERE event_name = 'subscription_canceled') AS churned_mrr
      FROM events
      WHERE event_name IN ('subscription_started', 'subscription_expanded', 'subscription_contracted', 'subscription_canceled')
        AND occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks') AT TIME ZONE 'UTC'
        AND occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
      GROUP BY 1
    ),
    totals AS (
      SELECT
        w.week,
        coalesce(f.new_mrr, 0) AS new_mrr,
        coalesce(f.expansion_mrr, 0) AS expansion_mrr,
        coalesce(f.contraction_mrr, 0) AS contraction_mrr,
        coalesce(f.churned_mrr, 0) AS churned_mrr
      FROM weeks AS w
      LEFT JOIN flows AS f ON f.week = w.week
    )
    SELECT week, new_mrr, expansion_mrr, contraction_mrr, churned_mrr, new_mrr + expansion_mrr - contraction_mrr - churned_mrr AS value
    FROM totals
    ORDER BY week;
  bigquery: |-
    -- Net new MRR per week: new + expansion − contraction − churned MRR, each from its event in that week. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    flows AS (
      SELECT
        DATE_TRUNC(DATE(occurred_at), ISOWEEK) AS week,
        SUM(IF(event_name = 'subscription_started', SAFE_CAST(JSON_VALUE(properties, '$.mrr') AS FLOAT64), NULL)) AS new_mrr,
        SUM(IF(event_name = 'subscription_expanded', SAFE_CAST(JSON_VALUE(properties, '$.mrr_delta') AS FLOAT64), NULL)) AS expansion_mrr,
        SUM(IF(event_name = 'subscription_contracted', SAFE_CAST(JSON_VALUE(properties, '$.mrr_delta') AS FLOAT64), NULL)) AS contraction_mrr,
        SUM(IF(event_name = 'subscription_canceled', SAFE_CAST(JSON_VALUE(properties, '$.mrr') AS FLOAT64), NULL)) AS churned_mrr
      FROM events
      WHERE event_name IN ('subscription_started', 'subscription_expanded', 'subscription_contracted', 'subscription_canceled')
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
      GROUP BY week
    ),
    totals AS (
      SELECT
        w.week,
        COALESCE(f.new_mrr, 0) AS new_mrr,
        COALESCE(f.expansion_mrr, 0) AS expansion_mrr,
        COALESCE(f.contraction_mrr, 0) AS contraction_mrr,
        COALESCE(f.churned_mrr, 0) AS churned_mrr
      FROM weeks AS w
      LEFT JOIN flows AS f ON f.week = w.week
    )
    SELECT week, new_mrr, expansion_mrr, contraction_mrr, churned_mrr, new_mrr + expansion_mrr - contraction_mrr - churned_mrr AS value
    FROM totals
    ORDER BY week;
  snowflake: |-
    -- Net new MRR per week: new + expansion − contraction − churned MRR, each from its event in that week. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -1 * ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    flows AS (
      SELECT
        DATEADD(day, 1 - DAYOFWEEKISO(occurred_at), occurred_at::date) AS week,
        SUM(IFF(event_name = 'subscription_started', TRY_TO_DOUBLE(properties:"mrr"::string), NULL)) AS new_mrr,
        SUM(IFF(event_name = 'subscription_expanded', TRY_TO_DOUBLE(properties:"mrr_delta"::string), NULL)) AS expansion_mrr,
        SUM(IFF(event_name = 'subscription_contracted', TRY_TO_DOUBLE(properties:"mrr_delta"::string), NULL)) AS contraction_mrr,
        SUM(IFF(event_name = 'subscription_canceled', TRY_TO_DOUBLE(properties:"mrr"::string), NULL)) AS churned_mrr
      FROM events
      WHERE event_name IN ('subscription_started', 'subscription_expanded', 'subscription_contracted', 'subscription_canceled')
        AND occurred_at >= DATEADD(week, -26, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
      GROUP BY 1
    ),
    totals AS (
      SELECT
        w.week,
        COALESCE(f.new_mrr, 0) AS new_mrr,
        COALESCE(f.expansion_mrr, 0) AS expansion_mrr,
        COALESCE(f.contraction_mrr, 0) AS contraction_mrr,
        COALESCE(f.churned_mrr, 0) AS churned_mrr
      FROM weeks AS w
      LEFT JOIN flows AS f ON f.week = w.week
    )
    SELECT week, new_mrr, expansion_mrr, contraction_mrr, churned_mrr, new_mrr + expansion_mrr - contraction_mrr - churned_mrr AS value
    FROM totals
    ORDER BY week;

noise:
  type: process
  min_denominator: 20
  volume_unit: MRR movements a week
  typical: 1400

example:
  business: saas
  level: 2390
  volume: 72
  trend: 0.35

drivers:
  - id: reconciliation
    label: Movements vs MRR
    metric: mrr
    dropped:
      check: Does net new MRR fall short of the change in the MRR snapshot from last Sunday to this one?
      yes: The snapshot grew more than the movements add up to, so a start or upgrade never reached the event stream, or a cancellation was recorded twice.
    spiked:
      check: Does net new MRR run ahead of the change in the MRR snapshot?
      yes: The movements add up to more than the snapshot grew, which points at a backfill, duplicated subscription_started events or a cancellation that never synced.
  - id: calendar
    label: Calendar
    feed: holidays
    dropped:
      check: Is this a holiday week, when purchases pause but renewals and cancellations don't?
      yes: New MRR falls, churn holds, and the same week last year shows the same dip.
    spiked:
      check: Is this the last week of a quarter, when sales-led deals close?
      yes: New MRR jumps in the same closing week of earlier quarters too.
  - id: churned
    label: Churned MRR
    metric: churned-mrr
    dropped:
      check: Did more subscriptions end, or larger ones?
      yes: Churned MRR rises by about as much as net new MRR fell.
    spiked:
      check: Did churn fall unusually low, or did failed payments recover?
      yes: Churned MRR falls by about as much as net new MRR rose.
  - id: new
    label: New MRR
    metric: new-mrr
    dropped:
      check: Did fewer customers start paying, or start on smaller plans?
      yes: New MRR falls by about as much as net new MRR while churn holds.
    spiked:
      check: Did a launch, a sales push or one large deal add new MRR?
      yes: New MRR jumps; check whether one customer is most of it.
  - id: expansion
    label: Expansion MRR
    metric: expansion-mrr
    dropped:
      check: Did upgrades and seat additions slow?
      yes: Expansion MRR falls while new and churned MRR hold.
    spiked:
      check: Did a price change or a usage limit push customers to upgrade?
      yes: Expansion MRR jumps in the week the change shipped.
  - id: contraction
    label: Contraction MRR
    breakdown: plan
    dropped:
      check: Did more customers move to cheaper plans or fewer seats without leaving?
      yes: subscription_contracted totals rise, often concentrated in one plan or after customers' own budget cuts.
    spiked:
      check: Did downgrades slow, or was a downgrade path removed?
      yes: Contraction falls; if a cheaper plan was removed, watch whether churn rises instead.

diagnose_order: [reconciliation, calendar, churned, new, expansion, contraction]

related: [mrr, new-mrr, expansion-mrr, churned-mrr, quick-ratio]

prose:
  why_it_matters: >-
    Net new MRR is the week's change in MRR explained by its four movements, and the one number
    that says whether the subscription business grew. Copperline, at $240k MRR, adds about $2,400 in
    an ordinary week, a pace of about half its MRR again in a year: roughly $3,800 of new and
    expansion MRR coming in against $1,400 of churn and contraction going out. New MRR alone can
    swing by about 70% on chance, so a quiet week of sales can take most of it away with nothing wrong. Never read it without
    its parts: the same net figure can be strong sales hiding a churn problem.
  pitfalls:
    - Net new MRR must equal the change in the MRR snapshot from one Sunday to the next. When it doesn't, a movement is missing, usually a plan change or cancellation that never reached the event stream.
    - Currency revaluations and price migrations change MRR without a customer acting. Classify them on their own, or they land in expansion or contraction.
    - Because it is the difference of two larger flows, it swings far more in percentage terms than any of its parts. Judge it in dollars against its own range, not as a percent change.
    - Reactivated customers belong with new MRR or on their own line, never netted against churn, or both flows look smaller than they are.


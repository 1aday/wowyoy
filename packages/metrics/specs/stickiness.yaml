id: stickiness
name: Stickiness
aliases:
  - DAU/MAU
  - DAU/MAU ratio
  - Stickiness ratio
  - Daily to monthly active ratio
family: engagement
kind: rate
polarity: up-is-good

definition:
  one_line: The share of a month's users who show up on a typical day, the week's average DAU divided by MAU for the 28 days ending that Sunday.
  formula: Average daily active users this week ÷ distinct active people in the 28 days ending Sunday 23:59 UTC

events:
  - name: "*"
    description: Any event a person sends, counted the same way on both sides of the ratio.
    also_called: [All events, Any event, Active event]
    properties:
      - name: $os
        description: The operating system, for splitting by platform.

numerator:
  label: Average daily active users
  aggregate: unique_users
  event: "*"

queries:
  hogql: |-
    -- Stickiness per week: the average of the week's seven daily counts of distinct active people (days in UTC) ÷ distinct active people in the four weeks (28 days) ending that Sunday. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(d.person_days, 0) / 7 AS numerator,
      coalesce(m.people, 0) AS denominator,
      if(denominator = 0, NULL, numerator / denominator) AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(1, 27))) AS week
    ) AS w
    LEFT JOIN (
      SELECT toMonday(day) AS week, count() AS person_days
      FROM (
        SELECT DISTINCT person_id, toDate(toTimeZone(timestamp, 'UTC')) AS day
        FROM events
        WHERE person_id IS NOT NULL
          AND timestamp >= now() - toIntervalWeek(27)
          AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(26) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
      )
      GROUP BY week
    ) AS d ON d.week = w.week
    LEFT JOIN (
      SELECT week, count(DISTINCT person_id) AS people
      FROM (
        SELECT person_id, active_week + toIntervalWeek(arrayJoin([0, 1, 2, 3])) AS week
        FROM (
          SELECT DISTINCT person_id, toMonday(toTimeZone(timestamp, 'UTC')) AS active_week
          FROM events
          WHERE person_id IS NOT NULL
            AND timestamp >= now() - toIntervalWeek(30)
            AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(29) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
        )
      )
      WHERE week BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(26) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
      GROUP BY week
    ) AS m ON m.week = w.week
    ORDER BY week
  postgres: |-
    -- Stickiness per week: the average of the week's seven daily counts of distinct active people (days in UTC) ÷ distinct active people in the four weeks (28 days) ending that Sunday. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '26 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '1 week',
        interval '1 week'
      ) AS g(week)
    ),
    person_days AS (
      SELECT DISTINCT
        user_id,
        (occurred_at AT TIME ZONE 'UTC')::date AS day,
        date_trunc('week', occurred_at AT TIME ZONE 'UTC')::date AS active_week
      FROM events
      WHERE user_id IS NOT NULL
        AND occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '29 weeks') AT TIME ZONE 'UTC'
        AND occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
    ),
    daily AS (
      SELECT active_week AS week, count(*) / 7.0 AS dau
      FROM person_days
      GROUP BY active_week
    ),
    monthly AS (
      SELECT w.week, count(DISTINCT p.user_id) AS mau
      FROM weeks AS w
      JOIN person_days AS p ON p.active_week BETWEEN w.week - 21 AND w.week
      GROUP BY w.week
    ),
    totals AS (
      SELECT w.week, coalesce(d.dau, 0) AS dau, coalesce(m.mau, 0) AS mau
      FROM weeks AS w
      LEFT JOIN daily AS d ON d.week = w.week
      LEFT JOIN monthly AS m ON m.week = w.week
    )
    SELECT week, dau AS numerator, mau AS denominator, dau / nullif(mau, 0) AS value
    FROM totals
    ORDER BY week;
  bigquery: |-
    -- Stickiness per week: the average of the week's seven daily counts of distinct active people (days in UTC) ÷ distinct active people in the four weeks (28 days) ending that Sunday. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    person_days AS (
      SELECT DISTINCT
        user_id,
        DATE(occurred_at) AS day,
        DATE_TRUNC(DATE(occurred_at), ISOWEEK) AS active_week
      FROM events
      WHERE user_id IS NOT NULL
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 29 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
    ),
    daily AS (
      SELECT active_week AS week, COUNT(*) / 7 AS dau
      FROM person_days
      GROUP BY active_week
    ),
    monthly AS (
      SELECT w.week, COUNT(DISTINCT p.user_id) AS mau
      FROM weeks AS w
      JOIN person_days AS p ON p.active_week BETWEEN DATE_SUB(w.week, INTERVAL 3 WEEK) AND w.week
      GROUP BY w.week
    ),
    totals AS (
      SELECT w.week, COALESCE(d.dau, 0) AS dau, COALESCE(m.mau, 0) AS mau
      FROM weeks AS w
      LEFT JOIN daily AS d ON d.week = w.week
      LEFT JOIN monthly AS m ON m.week = w.week
    )
    SELECT week, dau AS numerator, mau AS denominator, SAFE_DIVIDE(dau, mau) AS value
    FROM totals
    ORDER BY week;
  snowflake: |-
    -- Stickiness per week: the average of the week's seven daily counts of distinct active people (days in UTC) ÷ distinct active people in the four weeks (28 days) ending that Sunday. Last 26 complete weeks (Monday 00:00 UTC), oldest first.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -1 * ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    person_days AS (
      SELECT DISTINCT
        user_id,
        occurred_at::date AS day,
        DATEADD(day, 1 - DAYOFWEEKISO(occurred_at), occurred_at::date) AS active_week
      FROM events
      WHERE user_id IS NOT NULL
        AND occurred_at >= DATEADD(week, -29, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
    ),
    daily AS (
      SELECT active_week AS week, COUNT(*) / 7.0 AS dau
      FROM person_days
      GROUP BY active_week
    ),
    monthly AS (
      SELECT w.week, COUNT(DISTINCT p.user_id) AS mau
      FROM weeks AS w
      JOIN person_days AS p ON p.active_week BETWEEN DATEADD(week, -3, w.week) AND w.week
      GROUP BY w.week
    ),
    totals AS (
      SELECT w.week, COALESCE(d.dau, 0) AS dau, COALESCE(m.mau, 0) AS mau
      FROM weeks AS w
      LEFT JOIN daily AS d ON d.week = w.week
      LEFT JOIN monthly AS m ON m.week = w.week
    )
    SELECT week, dau AS numerator, mau AS denominator, dau::float / NULLIF(mau, 0) AS value
    FROM totals
    ORDER BY week;

noise:
  type: process
  min_denominator: 500
  volume_unit: monthly active users
  typical: 0.18

example:
  business: app
  level: 0.183
  volume: 120000
  trend: 0

drivers:
  - id: tracking
    label: Same activity on both sides
    dropped:
      check: Did a change add people to MAU who rarely come back, such as logged-out pages or a newly tracked web view?
      yes: MAU jumps on one platform or page with almost no daily return, while DAU barely moves.
    spiked:
      check: Did a background event start firing daily for people who didn't open the product?
      yes: DAU rises on one event or app version while sessions per user don't.
  - id: calendar
    label: Calendar
    feed: holidays
    dropped:
      check: Is it a holiday week, when daily routines break?
      yes: The same week last year shows the same dip once aligned on the holiday.
    spiked:
      check: Is it a season when the product becomes a daily habit, such as the new year for a budgeting app?
      yes: The same weeks last year show the same rise.
  - id: mau-inflow
    label: One-time users in MAU
    metric: mau
    dropped:
      check: Did a campaign or launch bring many people who used the product once?
      yes: MAU rises from new people who visit once and DAU barely moves, so the ratio falls without anyone using it less.
    spiked:
      check: Did one-time users from a past campaign just leave the 28-day window?
      yes: MAU falls four weeks after a spike while DAU holds.
  - id: dau-change
    label: Daily use by regulars
    metric: dau
    dropped:
      check: Did regular users come back on fewer days?
      yes: DAU falls while MAU holds; returning people are active fewer days a week.
    spiked:
      check: Did a daily feature, streak or reminder make people come back on more days?
      yes: DAU rises among existing users from the day it shipped.
  - id: platform
    label: Platform and releases
    breakdown: $os
    feed: app-stores
    dropped:
      check: Is the fall on one platform, after a release or OS update?
      yes: One platform's daily use falls from the release date while the other holds.
    spiked:
      check: Did a release on one platform make daily use easier, for example a widget or faster start?
      yes: One platform's daily use rises from the release date.
  - id: notifications
    label: Notifications
    dropped:
      check: Did push or reminder notifications stop, or get throttled by an OS permission change?
      yes: Daily returns from notification opens fall while other returns hold.
    spiked:
      check: Did a new daily notification go live?
      yes: DAU rises on notification opens; check that sessions per user and retention rise too, not only opens.

diagnose_order: [tracking, calendar, mau-inflow, dau-change, platform, notifications]

related: [dau, mau, wau, sessions-per-user, week-4-retention]

prose:
  why_it_matters: >-
    Stickiness is the share of a month's users who show up on a given day: 18% means the average
    monthly user comes back about 5 days in 28. It separates products people use from products
    people tried, and unlike DAU it doesn't rise just because marketing brought more people in.
    Its level depends on how often the product is meant to be used, so compare it with its own
    history rather than with another kind of product.
  pitfalls:
    - DAU and MAU must count the same activity. If MAU includes logged-out web visits and DAU only signed-in app opens, the ratio measures your tracking.
    - Calendar-month MAU makes stickiness jump every February. Use a fixed 28-day window.
    - The ratio rises when occasional users leave, so it can improve while the product shrinks. Read it with MAU.
    - Products meant to be used weekly, such as payroll or reporting tools, should read WAU/MAU instead; a low DAU/MAU is no problem for them.

reviewed_by: wowyoy
reviewed_at: "2026-10-21"
version: 1

id: arpa
name: Average revenue per account
aliases:
  - ARPA
  - Average revenue per customer
  - ARPC
  - Average MRR per customer
family: subscription
kind: currency
polarity: up-is-good

definition:
  one_line: The average monthly recurring revenue per paying customer account at the end of the week.
  formula: MRR at week end ÷ customer accounts with at least one paying subscription, measured Sunday 23:59 UTC

events:
  - name: subscription_updated
    description: Any change to a subscription's plan, quantity, discount or status, with its new monthly amount.
    also_called: [customer.subscription.updated, Subscription Updated, subscription_changed]
    properties:
      - name: subscription_id
        description: The billing system's subscription id.
      - name: mrr
        description: The subscription's monthly amount after the change, after discounts, before tax.
      - name: status
        description: active, trialing, past_due or canceled.

numerator:
  label: MRR at week end
  aggregate: sum
  event: subscription_updated
  property: mrr

queries:
  hogql: |-
    -- ARPA at the end of each of the last 26 complete ISO weeks (Monday start, UTC): MRR ÷ customers with at least one paying subscription. A customer is the person on the subscription; each subscription's latest state before the week closed counts.
    SELECT
      toString(monday) AS week,
      sum(account_mrr) AS numerator,
      count() AS denominator,
      sum(account_mrr) / count() AS value
    FROM (
      SELECT monday, account, sum(sub_mrr) AS account_mrr
      FROM (
        SELECT
          w.monday AS monday,
          e.sub_id AS sub_id,
          argMax(e.person, e.ts) AS account,
          if(argMax(e.state, e.ts) IN ('active', 'past_due'), argMax(e.amount, e.ts), 0) AS sub_mrr
        FROM (
          SELECT toMonday(now()) - toIntervalWeek(arrayJoin(range(1, 27))) AS monday
        ) AS w
        CROSS JOIN (
          SELECT
            toString(properties.subscription_id) AS sub_id,
            person_id AS person,
            toFloat(properties.mrr) AS amount,
            toString(properties.status) AS state,
            timestamp AS ts
          FROM events
          WHERE event = 'subscription_updated'
        ) AS e
        WHERE e.ts < w.monday + toIntervalWeek(1)
        GROUP BY monday, sub_id
      )
      GROUP BY monday, account
    )
    WHERE account_mrr > 0
    GROUP BY monday
    ORDER BY monday
  postgres: |-
    -- ARPA at the end of each of the last 26 complete ISO weeks (Monday start, UTC): MRR ÷ customers with at least one paying subscription. A customer is the event's user_id; each subscription's latest state before the week closed counts.
    WITH weeks AS (
      SELECT generate_series(
        date_trunc('week', now()) - interval '26 weeks',
        date_trunc('week', now()) - interval '1 week',
        interval '1 week'
      ) AS week
    ),
    latest AS (
      SELECT DISTINCT ON (w.week, e.properties->>'subscription_id')
        w.week,
        e.user_id AS customer,
        (e.properties->>'mrr')::numeric AS mrr,
        e.properties->>'status' AS status
      FROM weeks AS w
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < w.week + interval '1 week'
      ORDER BY w.week, e.properties->>'subscription_id', e.occurred_at DESC
    ),
    accounts AS (
      SELECT week, customer, sum(mrr) AS mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week::date AS week,
      sum(mrr) AS numerator,
      count(*) AS denominator,
      sum(mrr) / nullif(count(*), 0) AS value
    FROM accounts
    WHERE mrr > 0
    GROUP BY week
    ORDER BY week;
  bigquery: |-
    -- ARPA at the end of each of the last 26 complete ISO weeks (Monday start, UTC): MRR ÷ customers with at least one paying subscription. A customer is the event's user_id; each subscription's latest state before the week closed counts.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 26 WEEK),
        DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 1 WEEK),
        INTERVAL 1 WEEK
      )) AS week
    ),
    latest AS (
      SELECT
        w.week,
        e.user_id AS customer,
        SAFE_CAST(JSON_VALUE(e.properties, '$.mrr') AS FLOAT64) AS mrr,
        JSON_VALUE(e.properties, '$.status') AS status
      FROM weeks AS w
      JOIN events AS e
        ON DATE(e.occurred_at) < DATE_ADD(w.week, INTERVAL 1 WEEK)
      WHERE e.event_name = 'subscription_updated'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY w.week, JSON_VALUE(e.properties, '$.subscription_id')
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    accounts AS (
      SELECT week, customer, SUM(mrr) AS mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(mrr) AS numerator,
      COUNT(*) AS denominator,
      SAFE_DIVIDE(SUM(mrr), COUNT(*)) AS value
    FROM accounts
    WHERE mrr > 0
    GROUP BY week
    ORDER BY week;
  snowflake: |-
    -- ARPA at the end of each of the last 26 complete ISO weeks (Monday start, UTC): MRR ÷ customers with at least one paying subscription. A customer is the event's user_id; each subscription's latest state before the week closed counts. Assumes WEEK_START = 1 (Monday).
    WITH weeks AS (
      SELECT DATEADD(week, -ROW_NUMBER() OVER (ORDER BY SEQ4()), DATE_TRUNC('week', CURRENT_DATE())) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    latest AS (
      SELECT
        w.week,
        e.user_id AS customer,
        e.properties:mrr::float AS mrr,
        e.properties:status::string AS status
      FROM weeks AS w
      JOIN events AS e
        ON e.event_name = 'subscription_updated'
       AND e.occurred_at < DATEADD(week, 1, w.week)
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY w.week, e.properties:subscription_id::string
        ORDER BY e.occurred_at DESC
      ) = 1
    ),
    accounts AS (
      SELECT week, customer, SUM(mrr) AS mrr
      FROM latest
      WHERE status IN ('active', 'past_due')
      GROUP BY week, customer
    )
    SELECT
      week,
      SUM(mrr) AS numerator,
      COUNT(*) AS denominator,
      SUM(mrr) / NULLIF(COUNT(*), 0) AS value
    FROM accounts
    WHERE mrr > 0
    GROUP BY week
    ORDER BY week;

noise:
  type: mean
  cv: 1.3
  min_denominator: 50
  volume_unit: paying accounts
  typical: 126

example:
  business: saas
  level: 126
  volume: 1850
  trend: 0.14

drivers:
  - id: account-counting
    label: Account counting
    dropped:
      check: Did zero-amount, test or duplicate accounts start being counted?
      yes: The account count jumps with no matching rise in MRR, usually free plans now synced as subscriptions or one customer split across several ids.
    spiked:
      check: Did accounts merge or drop out of the count, for example after a customer-id migration?
      yes: The account count falls with no matching cancellations.
  - id: pricing
    label: Pricing and discounts
    dropped:
      check: Did a discount, coupon campaign or cheaper plan go live?
      yes: New and renewing accounts land at lower prices from the launch date.
    spiked:
      check: Did a price increase or coupon expiry take effect?
      yes: Many accounts change amount on the same day with no plan change. It won't repeat.
  - id: plan-mix
    label: Plan mix
    breakdown: plan
    dropped:
      check: Has the mix of accounts shifted toward cheaper plans?
      yes: The share of accounts on the entry plan grows while each plan's own average holds.
    spiked:
      check: Has the mix shifted toward larger plans?
      yes: The share of accounts on the top plans grows while each plan's own average holds.
  - id: churn-mix
    label: Who churned
    metric: logo-churn-rate
    dropped:
      check: Did larger accounts churn or downgrade?
      yes: The MRR lost per departing account is well above ARPA this week.
    spiked:
      check: Did many small accounts churn, lifting the average without anyone paying more?
      yes: Logo churn rises while MRR barely moves. ARPA rose for a bad reason.
  - id: new-mix
    label: Who started
    metric: new-mrr
    dropped:
      check: Are new customers starting on smaller plans than the base pays?
      yes: New MRR per new account is well below ARPA, often after a cheaper plan or a self-serve launch.
    spiked:
      check: Did a few large new accounts, or a move upmarket, lift the average?
      yes: New MRR per new account is well above ARPA; one or two deals explain most of it.
  - id: expansion
    label: Expansion
    metric: expansion-mrr
    dropped:
      check: Did upgrades and seat additions slow while accounts kept growing?
      yes: Expansion MRR falls below its usual range for several weeks.
    spiked:
      check: Did upgrades or a usage limit raise what existing accounts pay?
      yes: Expansion MRR jumps in the weeks ARPA rose.

diagnose_order: [account-counting, pricing, plan-mix, churn-mix, new-mix, expansion]

related: [mrr, new-mrr, expansion-mrr, logo-churn-rate, customer-lifetime-value]

prose:
  why_it_matters: >-
    ARPA says what a typical customer is worth each month, and it moves with pricing, packaging
    and who you sell to rather than with how many you sell. Rising ARPA with a flat customer
    count is expansion working; rising ARPA because small customers left is churn in disguise.
    At $126 a month, a $10 move that holds for several weeks is a change in pricing or in who buys.
  pitfalls:
    - Divide by paying accounts, not users or seats. A customer with ten seats is one account; counting seats turns ARPA into price per seat.
    - Free plans and zero-amount subscriptions in the count pull ARPA down every time sign-ups rise. Count only accounts paying more than zero.
    - A customer with several subscriptions is still one account. Counting subscriptions understates ARPA for exactly the customers who buy the most.
    - ARPA rising because small customers churned looks like good news on its own. Read it next to logo churn.
    - When a few enterprise accounts are a large share of MRR, the mean hides the typical customer. Look at the median too.


id: second-order-rate
name: Second order rate
aliases:
  - Second purchase rate
  - 90-day repeat rate
  - Second order conversion
family: customers
kind: rate
polarity: up-is-good

definition:
  one_line: The share of first-time customers who place a second order within 90 days of their first, by the week of the first order.
  formula: Customers who ordered again within 90 days ÷ customers whose first order fell in the week

events:
  - name: order_completed
    description: A paid order confirmed by the server, not the thank-you page view.
    also_called: [purchase, Order Completed, checkout_completed]
    properties:
      - name: is_first_order
        description: True when the store has no earlier order from this customer, from its own customer records.
      - name: customer_id
        description: The store's customer id, shared by guest and logged-in orders with the same email.
      - name: order_id
        description: Unique per order, so a duplicate of the first order is never taken for a second one.
      - name: coupon
        description: The discount code used, if any.

numerator:
  label: First-time customers who ordered again within 90 days
  aggregate: unique_users
  event: order_completed
  where:
    - property: is_first_order
      op: eq
      value: false
denominator:
  label: Customers whose first order fell in the week
  aggregate: unique_users
  event: order_completed
  where:
    - property: is_first_order
      op: eq
      value: true

queries:
  hogql: |-
    -- Second order rate: of customers whose first order fell in each week, the share who placed another order within 90 days of it. First-order weeks 39 to 14 weeks ago; younger cohorts are left out until their 90 days close.
    SELECT
      toString(week_start) AS week,
      countIf(reordered) AS numerator,
      count() AS denominator,
      if(count() > 0, countIf(reordered) / count(), NULL) AS value
    FROM (
      SELECT
        toMonday(f.first_at) AS week_start,
        countIf(o.order_id != f.first_order_id AND o.ts > f.first_at AND o.ts <= f.first_at + toIntervalDay(90)) > 0 AS reordered
      FROM (
        SELECT
          coalesce(properties.customer_id, toString(person_id)) AS customer_id,
          min(timestamp) AS first_at,
          argMin(properties.order_id, timestamp) AS first_order_id
        FROM events
        WHERE event = 'order_completed'
          AND properties.is_first_order = 'true'
          AND timestamp >= toMonday(now()) - toIntervalWeek(39)
          AND timestamp < toMonday(now()) - toIntervalWeek(13)
        GROUP BY customer_id
      ) AS f
      INNER JOIN (
        SELECT
          coalesce(properties.customer_id, toString(person_id)) AS customer_id,
          properties.order_id AS order_id,
          timestamp AS ts
        FROM events
        WHERE event = 'order_completed'
          AND timestamp >= toMonday(now()) - toIntervalWeek(39)
      ) AS o ON o.customer_id = f.customer_id
      GROUP BY week_start, f.customer_id
    )
    GROUP BY week_start
    ORDER BY week_start
  postgres: |-
    -- Second order rate: of customers whose first order fell in each week, the share who placed another order within 90 days of it. First-order weeks 39 to 14 weeks ago; younger cohorts are left out until their 90 days close.
    WITH paid_orders AS (
      SELECT
        coalesce(properties->>'customer_id', user_id) AS customer_id,
        properties->>'order_id' AS order_id,
        properties->>'is_first_order' = 'true' AS is_first_order,
        occurred_at
      FROM events
      WHERE event_name = 'order_completed'
        AND occurred_at >= date_trunc('week', now()) - interval '39 weeks'
    ),
    first_orders AS (
      SELECT DISTINCT ON (customer_id) customer_id, order_id AS first_order_id, occurred_at AS first_at
      FROM paid_orders
      WHERE is_first_order
        AND occurred_at < date_trunc('week', now()) - interval '13 weeks'
      ORDER BY customer_id, occurred_at
    ),
    cohort AS (
      SELECT
        date_trunc('week', f.first_at)::date AS week,
        f.customer_id,
        count(o.order_id) > 0 AS reordered
      FROM first_orders f
      LEFT JOIN paid_orders o
        ON o.customer_id = f.customer_id
       AND o.order_id <> f.first_order_id
       AND o.occurred_at > f.first_at
       AND o.occurred_at <= f.first_at + interval '90 days'
      GROUP BY week, f.customer_id
    )
    SELECT
      week,
      count(*) FILTER (WHERE reordered) AS numerator,
      count(*) AS denominator,
      (count(*) FILTER (WHERE reordered))::numeric / nullif(count(*), 0) AS value
    FROM cohort
    GROUP BY week
    ORDER BY week;
  bigquery: |-
    -- Second order rate: of customers whose first order fell in each week, the share who placed another order within 90 days of it. First-order weeks 39 to 14 weeks ago; younger cohorts are left out until their 90 days close.
    WITH paid_orders AS (
      SELECT
        COALESCE(JSON_VALUE(properties, '$.customer_id'), user_id) AS customer_id,
        JSON_VALUE(properties, '$.order_id') AS order_id,
        JSON_VALUE(properties, '$.is_first_order') = 'true' AS is_first_order,
        occurred_at
      FROM events
      WHERE event_name = 'order_completed'
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 39 WEEK))
    ),
    first_orders AS (
      SELECT customer_id, MIN(occurred_at) AS first_at, MIN_BY(order_id, occurred_at) AS first_order_id
      FROM paid_orders
      WHERE is_first_order
        AND occurred_at < TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 13 WEEK))
      GROUP BY customer_id
    ),
    cohort AS (
      SELECT
        DATE_TRUNC(DATE(f.first_at), ISOWEEK) AS week,
        f.customer_id,
        COUNT(o.order_id) > 0 AS reordered
      FROM first_orders AS f
      LEFT JOIN paid_orders AS o
        ON o.customer_id = f.customer_id
       AND o.order_id != f.first_order_id
       AND o.occurred_at > f.first_at
       AND o.occurred_at <= TIMESTAMP_ADD(f.first_at, INTERVAL 90 DAY)
      GROUP BY week, f.customer_id
    )
    SELECT
      week,
      COUNTIF(reordered) AS numerator,
      COUNT(*) AS denominator,
      SAFE_DIVIDE(COUNTIF(reordered), COUNT(*)) AS value
    FROM cohort
    GROUP BY week
    ORDER BY week;
  snowflake: |-
    -- Second order rate: of customers whose first order fell in each week, the share who placed another order within 90 days of it. First-order weeks 39 to 14 weeks ago; younger cohorts are left out until their 90 days close. Assumes WEEK_START = 1 (Monday).
    WITH paid_orders AS (
      SELECT
        COALESCE(properties:customer_id::string, user_id) AS customer_id,
        properties:order_id::string AS order_id,
        properties:is_first_order::boolean AS is_first_order,
        occurred_at
      FROM events
      WHERE event_name = 'order_completed'
        AND occurred_at >= DATEADD(week, -39, DATE_TRUNC('week', CURRENT_DATE()))
    ),
    first_orders AS (
      SELECT customer_id, MIN(occurred_at) AS first_at, MIN_BY(order_id, occurred_at) AS first_order_id
      FROM paid_orders
      WHERE is_first_order
        AND occurred_at < DATEADD(week, -13, DATE_TRUNC('week', CURRENT_DATE()))
      GROUP BY customer_id
    ),
    cohort AS (
      SELECT
        DATE_TRUNC('week', f.first_at)::date AS week,
        f.customer_id,
        COUNT(o.order_id) > 0 AS reordered
      FROM first_orders AS f
      LEFT JOIN paid_orders AS o
        ON o.customer_id = f.customer_id
       AND o.order_id != f.first_order_id
       AND o.occurred_at > f.first_at
       AND o.occurred_at <= DATEADD(day, 90, f.first_at)
      GROUP BY week, f.customer_id
    )
    SELECT
      week,
      COUNT_IF(reordered) AS numerator,
      COUNT(*) AS denominator,
      DIV0NULL(COUNT_IF(reordered), COUNT(*)) AS value
    FROM cohort
    GROUP BY week
    ORDER BY week;

noise:
  type: binomial
  min_denominator: 200
  volume_unit: first-time customers in the cohort
  typical: 0.21

example:
  business: store
  level: 0.21
  volume: 7700
  trend: 0.02

drivers:
  - id: tracking
    label: Order and customer records
    dropped:
      check: Did customer matching break during the cohort's 90 days, so second orders landed under new ids?
      yes: Second orders fall while new customers rise by a similar number in the same weeks.
    spiked:
      check: Are duplicate order events or split shipments being counted as second orders?
      yes: Many second orders arrive within minutes or hours of the first, often with the same items.
  - id: calendar
    label: Holiday cohorts
    feed: shopping
    dropped:
      check: Is this a holiday or Black Friday cohort? Gift buyers and deal hunters reorder far less.
      yes: The same cohort weeks last year show the same dip.
    spiked:
      check: Did the cohort's 90 days include a big sale that pulled second orders forward?
      yes: An unusual share of second orders landed in one sale week inside the window.
  - id: cohort-source
    label: How the cohort was won
    breakdown: coupon
    dropped:
      check: Did the cohort come in on a deep discount, a giveaway or one new paid channel?
      yes: Customers whose first order used that code or came from that channel reorder far less than the rest.
    spiked:
      check: Did the cohort come mostly from referrals, email signups or full-price buyers?
      yes: The share of first orders without a discount code is higher than in neighbouring cohorts.
  - id: first-experience
    label: First-order experience
    metric: refund-rate
    dropped:
      check: Did the cohort's first orders arrive late or damaged, or get refunded more than usual?
      yes: Refunds or delivery complaints on first orders from the cohort week run above normal.
    spiked:
      check: Did delivery get faster or a packaging or product fix land for this cohort?
      yes: Refunds and complaints on the cohort's first orders run below normal.
  - id: post-purchase-flows
    label: Post-purchase emails
    metric: email-click-rate
    dropped:
      check: Did the post-purchase or replenishment flow stop sending during the cohort's 90 days?
      yes: Flow sends or clicks to the cohort fell, and second orders from email fell with them.
    spiked:
      check: Did a new post-purchase offer or replenishment reminder start for this cohort?
      yes: Second orders from the new flow account for most of the gain.

diagnose_order: [tracking, calendar, cohort-source, first-experience, post-purchase-flows]

related: [repeat-purchase-rate, customer-lifetime-value, new-customers, refund-rate, purchase-frequency]

prose:
  why_it_matters: >-
    The second order is the hardest one to win and the best early read on lifetime value: a customer
    who has ordered twice is far likelier to order a third time than a first-time buyer is to order a
    second. It judges a cohort in 90 days instead of a year, so it is the first number to show
    whether a campaign brought buyers or bargain hunters. With 8,000 first-time customers in a
    cohort, a move of 1.3 points is real.
  pitfalls:
    - Only cohorts whose 90 days have closed are reported, so the latest point describes customers who first ordered 14 weeks ago. Showing younger cohorts makes every recent week look like a collapse.
    - Holiday cohorts reorder less because many first orders are gifts. Compare a cohort with the same weeks last year, not with the cohort before it.
    - A deep first-order discount wins customers who wait for the next discount. Split by first-order coupon before crediting or blaming the product.
    - A duplicate order event a few minutes after the first is not a second order. This spec requires a different order id.
    - Ninety days suits most consumer goods; for products bought once or twice a year, a 180- or 365-day window is the fair one, stated on the chart.

reviewed_by: null
reviewed_at: null
version: 1

id: ltv-to-cac
name: LTV to CAC
aliases:
  - LTV:CAC
  - LTV/CAC ratio
  - LTV to CAC ratio
  - CLV to CAC ratio
family: customers
kind: ratio
polarity: up-is-good

definition:
  one_line: The gross profit a week's new customers bring in their first 365 days, for every dollar of ad spend that week.
  formula: 12-month gross profit per new customer ÷ new customer acquisition cost, by first-order week (the cohort's 12-month gross profit ÷ that week's ad spend)

events:
  - name: order_completed
    description: A paid order confirmed by the server, not the thank-you page view.
    also_called: [purchase, Order Completed, checkout_completed]
    properties:
      - name: is_first_order
        description: True when the store has no earlier order from this customer, from its own customer records.
      - name: customer_id
        description: The store's customer id, shared by guest and logged-in orders with the same email.
      - name: total
        description: Order value after discounts, before tax and shipping.
      - name: cost_of_goods
        description: The landed cost of the order's items, purchase price plus inbound freight and duties.
  - name: order_refunded
    description: A refund issued against an earlier order, full or partial.
    also_called: [refund, Order Refunded]
    properties:
      - name: order_id
        description: The order the refund belongs to.
      - name: amount
        description: The refunded amount, excluding tax and shipping.
  - name: ad_spend
    description: One row per ad channel per day, synced from the ad platforms.
    also_called: [Ad Spend, ad_performance, campaign_daily_stats]
    properties:
      - name: spend
        description: The day's spend on the channel, in the store's currency.
      - name: channel
        description: The ad platform, such as meta or google.

numerator:
  label: Cohort gross profit in its first 365 days
  aggregate: sum
  event: order_completed
  property: total
denominator:
  label: Ad spend in the cohort week
  aggregate: sum
  event: ad_spend
  property: spend

queries:
  hogql: |-
    -- LTV to CAC: gross profit (order totals − cost of goods − refunds) from each first-order week's new customers over their first 365 days ÷ ad spend in that week. First-order weeks 79 to 54 weeks before this one (Monday 00:00 UTC), oldest first; younger cohorts are left out until their 365 days close.
    -- HogQL: paste into a PostHog SQL insight.
    SELECT
      w.week AS week,
      coalesce(c.amount_total, 0) AS numerator,
      coalesce(a.spend, 0) AS denominator,
      if(denominator = 0, NULL, numerator / denominator) AS value
    FROM (
      SELECT toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(arrayJoin(range(54, 80))) AS week
    ) AS w
    LEFT JOIN (
      SELECT week, sum(amount) AS amount_total, count() AS customers
      FROM (
        SELECT
          toMonday(f.first_at) AS week,
          f.customer_id AS customer_id,
          sumIf(o.amount, o.ts >= f.first_at AND o.ts < f.first_at + toIntervalDay(365)) AS amount
        FROM (
          SELECT customer_id, min(ts) AS first_at
          FROM (
            SELECT coalesce(properties.customer_id, toString(person_id)) AS customer_id, toTimeZone(timestamp, 'UTC') AS ts
            FROM events
            WHERE event = 'order_completed'
              AND properties.is_first_order = 'true'
              AND timestamp >= now() - toIntervalWeek(80)
              AND toMonday(toTimeZone(timestamp, 'UTC')) >= toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(79)
          )
          WHERE customer_id IS NOT NULL
          GROUP BY customer_id
        ) AS f
        INNER JOIN (
          SELECT po.customer_id AS customer_id, po.ts AS ts, po.total - coalesce(po.cost_of_goods, 0) - coalesce(r.refunded, 0) AS amount
          FROM (
            SELECT
              coalesce(properties.customer_id, toString(person_id)) AS customer_id,
              properties.order_id AS order_id,
              toTimeZone(timestamp, 'UTC') AS ts,
              toFloat(properties.total) AS total,
              toFloat(properties.cost_of_goods) AS cost_of_goods
            FROM events
            WHERE event = 'order_completed'
              AND timestamp >= now() - toIntervalWeek(80)
              AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(79) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
          ) AS po
          LEFT JOIN (
            SELECT properties.order_id AS order_id, sum(toFloat(properties.amount)) AS refunded
            FROM events
            WHERE event = 'order_refunded'
              AND timestamp >= now() - toIntervalWeek(80)
              AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(79) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(1)
            GROUP BY order_id
          ) AS r ON r.order_id = po.order_id
        ) AS o ON o.customer_id = f.customer_id
        WHERE toMonday(f.first_at) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(79) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(54)
        GROUP BY week, customer_id
      )
      GROUP BY week
    ) AS c ON c.week = w.week
    LEFT JOIN (
      SELECT toMonday(toTimeZone(timestamp, 'UTC')) AS week, sum(toFloat(properties.spend)) AS spend
      FROM events
      WHERE event = 'ad_spend'
        AND timestamp >= now() - toIntervalWeek(80)
        AND toMonday(toTimeZone(timestamp, 'UTC')) BETWEEN toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(79) AND toMonday(toTimeZone(now(), 'UTC')) - toIntervalWeek(54)
      GROUP BY week
    ) AS a ON a.week = w.week
    ORDER BY week
  postgres: |-
    -- LTV to CAC: gross profit (order totals − cost of goods − refunds) from each first-order week's new customers over their first 365 days ÷ ad spend in that week. First-order weeks 79 to 54 weeks before this one (Monday 00:00 UTC), oldest first; younger cohorts are left out until their 365 days close.
    -- Postgres. Reads events(event_name text, occurred_at timestamptz, user_id text, session_id text, properties jsonb). Weeks are cut in UTC whatever the session time zone.
    WITH weeks AS (
      SELECT g.week::date AS week
      FROM generate_series(
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '79 weeks',
        date_trunc('week', now() AT TIME ZONE 'UTC') - interval '54 weeks',
        interval '1 week'
      ) AS g(week)
    ),
    refunds AS (
      SELECT properties->>'order_id' AS order_id, sum(CASE WHEN properties->>'amount' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'amount')::numeric END) AS refunded
      FROM events
      WHERE event_name = 'order_refunded'
        AND occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '79 weeks') AT TIME ZONE 'UTC'
        AND occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
      GROUP BY 1
    ),
    orders AS (
      SELECT
        coalesce(e.properties->>'customer_id', e.user_id) AS customer_id,
        e.properties->>'is_first_order' = 'true' AS is_first_order,
        e.occurred_at AT TIME ZONE 'UTC' AS ts,
        CASE WHEN e.properties->>'total' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (e.properties->>'total')::numeric END
          - coalesce(CASE WHEN e.properties->>'cost_of_goods' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (e.properties->>'cost_of_goods')::numeric END, 0)
          - coalesce(r.refunded, 0) AS amount
      FROM events AS e
      LEFT JOIN refunds AS r ON r.order_id = e.properties->>'order_id'
      WHERE e.event_name = 'order_completed'
        AND e.occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '79 weeks') AT TIME ZONE 'UTC'
        AND e.occurred_at < date_trunc('week', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'
    ),
    first_orders AS (
      SELECT customer_id, min(ts) AS first_at
      FROM orders
      WHERE is_first_order
        AND customer_id IS NOT NULL
        AND ts < date_trunc('week', now() AT TIME ZONE 'UTC') - interval '53 weeks'
      GROUP BY customer_id
    ),
    cohort AS (
      SELECT date_trunc('week', f.first_at)::date AS week, f.customer_id, sum(o.amount) AS amount
      FROM first_orders AS f
      JOIN orders AS o
        ON o.customer_id = f.customer_id
       AND o.ts >= f.first_at
       AND o.ts < f.first_at + interval '365 days'
      GROUP BY 1, 2
    ),
    spend AS (
      SELECT date_trunc('week', occurred_at AT TIME ZONE 'UTC')::date AS week, sum(CASE WHEN properties->>'spend' ~ '^-?[0-9]+(\.[0-9]+)?$' THEN (properties->>'spend')::numeric END) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '79 weeks') AT TIME ZONE 'UTC'
        AND occurred_at < (date_trunc('week', now() AT TIME ZONE 'UTC') - interval '53 weeks') AT TIME ZONE 'UTC'
      GROUP BY 1
    ),
    profit AS (
      SELECT week, sum(amount) AS gross_profit
      FROM cohort
      GROUP BY week
    ),
    totals AS (
      SELECT w.week, coalesce(p.gross_profit, 0) AS gross_profit, coalesce(s.spend, 0) AS spend
      FROM weeks AS w
      LEFT JOIN profit AS p ON p.week = w.week
      LEFT JOIN spend AS s ON s.week = w.week
    )
    SELECT week, gross_profit AS numerator, spend AS denominator, gross_profit / nullif(spend, 0) AS value
    FROM totals
    ORDER BY week;
  bigquery: |-
    -- LTV to CAC: gross profit (order totals − cost of goods − refunds) from each first-order week's new customers over their first 365 days ÷ ad spend in that week. First-order weeks 79 to 54 weeks before this one (Monday 00:00 UTC), oldest first; younger cohorts are left out until their 365 days close.
    -- BigQuery. Reads events(event_name STRING, occurred_at TIMESTAMP, user_id STRING, session_id STRING, properties JSON). Weeks are cut in UTC.
    WITH weeks AS (
      SELECT week
      FROM UNNEST(GENERATE_DATE_ARRAY(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 79 WEEK), DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 54 WEEK), INTERVAL 1 WEEK)) AS week
    ),
    refunds AS (
      SELECT JSON_VALUE(properties, '$.order_id') AS order_id, SUM(SAFE_CAST(JSON_VALUE(properties, '$.amount') AS FLOAT64)) AS refunded
      FROM events
      WHERE event_name = 'order_refunded'
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 79 WEEK))
        AND occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
      GROUP BY order_id
    ),
    orders AS (
      SELECT
        COALESCE(JSON_VALUE(e.properties, '$.customer_id'), e.user_id) AS customer_id,
        JSON_VALUE(e.properties, '$.is_first_order') = 'true' AS is_first_order,
        e.occurred_at,
        SAFE_CAST(JSON_VALUE(e.properties, '$.total') AS FLOAT64)
          - COALESCE(SAFE_CAST(JSON_VALUE(e.properties, '$.cost_of_goods') AS FLOAT64), 0)
          - COALESCE(r.refunded, 0) AS amount
      FROM events AS e
      LEFT JOIN refunds AS r ON r.order_id = JSON_VALUE(e.properties, '$.order_id')
      WHERE e.event_name = 'order_completed'
        AND e.occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 79 WEEK))
        AND e.occurred_at < TIMESTAMP(DATE_TRUNC(CURRENT_DATE(), ISOWEEK))
    ),
    first_orders AS (
      SELECT customer_id, MIN(occurred_at) AS first_at
      FROM orders
      WHERE is_first_order
        AND customer_id IS NOT NULL
        AND occurred_at < TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 53 WEEK))
      GROUP BY customer_id
    ),
    cohort AS (
      SELECT DATE_TRUNC(DATE(f.first_at), ISOWEEK) AS week, f.customer_id, SUM(o.amount) AS amount
      FROM first_orders AS f
      JOIN orders AS o
        ON o.customer_id = f.customer_id
       AND o.occurred_at >= f.first_at
       AND o.occurred_at < TIMESTAMP_ADD(f.first_at, INTERVAL 365 DAY)
      GROUP BY week, f.customer_id
    ),
    spend AS (
      SELECT DATE_TRUNC(DATE(occurred_at), ISOWEEK) AS week, SUM(SAFE_CAST(JSON_VALUE(properties, '$.spend') AS FLOAT64)) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 79 WEEK))
        AND occurred_at < TIMESTAMP(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), ISOWEEK), INTERVAL 53 WEEK))
      GROUP BY week
    ),
    profit AS (
      SELECT week, SUM(amount) AS gross_profit
      FROM cohort
      GROUP BY week
    ),
    totals AS (
      SELECT w.week, COALESCE(p.gross_profit, 0) AS gross_profit, COALESCE(s.spend, 0) AS spend
      FROM weeks AS w
      LEFT JOIN profit AS p ON p.week = w.week
      LEFT JOIN spend AS s ON s.week = w.week
    )
    SELECT week, gross_profit AS numerator, spend AS denominator, SAFE_DIVIDE(gross_profit, spend) AS value
    FROM totals
    ORDER BY week;
  snowflake: |-
    -- LTV to CAC: gross profit (order totals − cost of goods − refunds) from each first-order week's new customers over their first 365 days ÷ ad spend in that week. First-order weeks 79 to 54 weeks before this one (Monday 00:00 UTC), oldest first; younger cohorts are left out until their 365 days close.
    -- Snowflake. Reads events(event_name VARCHAR, occurred_at TIMESTAMP_NTZ in UTC, user_id VARCHAR, session_id VARCHAR, properties VARIANT). Weeks start Monday whatever WEEK_START is set to.
    WITH weeks AS (
      SELECT DATEADD(week, -53 - ROW_NUMBER() OVER (ORDER BY SEQ4()), DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)) AS week
      FROM TABLE(GENERATOR(ROWCOUNT => 26))
    ),
    refunds AS (
      SELECT properties:"order_id"::string AS order_id, SUM(TRY_TO_DOUBLE(properties:"amount"::string)) AS refunded
      FROM events
      WHERE event_name = 'order_refunded'
        AND occurred_at >= DATEADD(week, -79, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
      GROUP BY 1
    ),
    orders AS (
      SELECT
        COALESCE(e.properties:"customer_id"::string, e.user_id) AS customer_id,
        e.properties:"is_first_order"::string = 'true' AS is_first_order,
        e.occurred_at,
        TRY_TO_DOUBLE(e.properties:"total"::string)
          - COALESCE(TRY_TO_DOUBLE(e.properties:"cost_of_goods"::string), 0)
          - COALESCE(r.refunded, 0) AS amount
      FROM events AS e
      LEFT JOIN refunds AS r ON r.order_id = e.properties:"order_id"::string
      WHERE e.event_name = 'order_completed'
        AND e.occurred_at >= DATEADD(week, -79, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND e.occurred_at < DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date)
    ),
    first_orders AS (
      SELECT customer_id, MIN(occurred_at) AS first_at
      FROM orders
      WHERE is_first_order
        AND customer_id IS NOT NULL
        AND occurred_at < DATEADD(week, -53, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
      GROUP BY customer_id
    ),
    cohort AS (
      SELECT DATEADD(day, 1 - DAYOFWEEKISO(f.first_at), f.first_at::date) AS week, f.customer_id, SUM(o.amount) AS amount
      FROM first_orders AS f
      JOIN orders AS o
        ON o.customer_id = f.customer_id
       AND o.occurred_at >= f.first_at
       AND o.occurred_at < DATEADD(day, 365, f.first_at)
      GROUP BY 1, 2
    ),
    spend AS (
      SELECT DATEADD(day, 1 - DAYOFWEEKISO(occurred_at), occurred_at::date) AS week, SUM(TRY_TO_DOUBLE(properties:"spend"::string)) AS spend
      FROM events
      WHERE event_name = 'ad_spend'
        AND occurred_at >= DATEADD(week, -79, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
        AND occurred_at < DATEADD(week, -53, DATEADD(day, 1 - DAYOFWEEKISO(SYSDATE()), SYSDATE()::date))
      GROUP BY 1
    ),
    profit AS (
      SELECT week, SUM(amount) AS gross_profit
      FROM cohort
      GROUP BY week
    ),
    totals AS (
      SELECT w.week, COALESCE(p.gross_profit, 0) AS gross_profit, COALESCE(s.spend, 0) AS spend
      FROM weeks AS w
      LEFT JOIN profit AS p ON p.week = w.week
      LEFT JOIN spend AS s ON s.week = w.week
    )
    SELECT week, gross_profit AS numerator, spend AS denominator, gross_profit / NULLIF(spend, 0) AS value
    FROM totals
    ORDER BY week;

noise:
  type: process
  min_denominator: 200
  volume_unit: first-time customers in the cohort
  typical: 2

example:
  business: store
  level: 2.3
  volume: 6800
  trend: -0.05

drivers:
  - id: spend-tracking
    label: Spend records
    dropped:
      check: Was spend double counted in the cohort week, such as a platform synced twice or a monthly invoice booked in one week?
      yes: Spend in the cohort week is far above the ad platforms' own reports for those days.
    spiked:
      check: Did a channel's spend fail to sync for the cohort week?
      yes: One channel shows zero or partial spend on days it was running.
  - id: calendar
    label: Holiday cohorts
    feed: shopping
    dropped:
      check: Is this a Black Friday or holiday cohort, won at a peak price and reordering less?
      yes: The same cohort weeks last year show the same dip.
    spiked:
      check: Is this a quiet-season cohort, won cheaply from returning visitors and organic search?
      yes: The same cohort weeks last year show the same rise.
  - id: cac
    label: Acquisition cost
    metric: ncac
    dropped:
      check: Did new customers cost more to win in the cohort week?
      yes: New customer CAC for that week sits above its usual range while 12-month value holds.
    spiked:
      check: Did new customers cost less to win, from cheaper media or more organic buyers?
      yes: New customer CAC for that week sits below its usual range.
  - id: ltv
    label: 12-month value
    metric: customer-lifetime-value
    dropped:
      check: Did the cohort spend less in its first year?
      yes: Customer lifetime value for the cohort falls while CAC holds.
    spiked:
      check: Did the cohort spend more in its first year?
      yes: Customer lifetime value for the cohort rises while CAC holds.
  - id: margin
    label: Gross margin
    metric: gross-margin
    dropped:
      check: Did product costs rise or discounts deepen during the cohort's year?
      yes: Revenue per customer holds while gross margin on their orders falls.
    spiked:
      check: Did a price rise or cheaper sourcing lift margin on the cohort's orders?
      yes: Gross margin on the cohort's orders runs above earlier cohorts.
  - id: channel-mix
    label: Channel mix
    feed: ad-platforms
    dropped:
      check: Did spend shift in the cohort week to a channel that wins lower-value buyers?
      yes: Spend share moved to one channel whose customers have a lower 12-month value.
    spiked:
      check: Did spend shift toward channels whose customers are worth more?
      yes: Spend share moved to a channel whose customers have a higher 12-month value.

diagnose_order: [spend-tracking, calendar, cac, ltv, margin, channel-mix]

related: [customer-lifetime-value, ncac, blended-cac, cac-payback, gross-margin]

prose:
  why_it_matters: >-
    LTV to CAC asks whether acquisition pays: at 1.0 a cohort's first year of gross profit only just
    repays what it cost to win. The 3-to-1 rule of thumb from SaaS counts a whole customer lifetime;
    12 months of realized gross profit sits lower by construction, so judge it against your own
    earlier cohorts. At Northwind a year-old cohort earned about $80 of gross profit per customer
    ($138 of first-year revenue at 58% gross margin) against about $35 of ad spend, a ratio of
    about 2.3. Below 1 is growth bought too dear; a ratio well above the
    usual range can mean the budget could grow.
  pitfalls:
    - Use gross profit, not revenue. A revenue ratio of 3 at a 40% margin is a gross-profit ratio of 1.2, which barely pays back.
    - This spec divides all ad spend by all new customers, so organic buyers make paid media look better than it is. Read paid-channel numbers before raising budgets.
    - Ratios built from projected lifetimes, such as ARPA × margin ÷ churn in SaaS, explode as churn nears zero. Cap the lifetime at 3 to 5 years, or use realized months as this spec does.
    - Spend booked in the wrong week, from monthly invoices or a failed sync, makes one cohort look free and the next ruinous. Check daily spend by channel before reading a jump.
    - Only cohorts whose 365 days have closed are reported, so this lags by a year. Steer today's acquisition with new customer CAC and second order rate.

